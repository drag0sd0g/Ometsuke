[project]
name = "ometsuke"
version = "0.1.0"
description = "An event-sourced, replayable evaluation harness for Japanese accounting-fraud detection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "duckdb>=1.0",
]

[project.scripts]
ometsuke = "ometsuke.cli:main"

[dependency-groups]
dev = [
    "mutmut>=3.8.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ometsuke"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mutmut]
source_paths = ["src/ometsuke"]
do_not_mutate = ["src/ometsuke/cli.py"]
mutate_only_covered_lines = true
process_isolation = "forkserver"
