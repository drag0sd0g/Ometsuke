<script id="payload" type="application/json">{"seed": 20260823, "built": "2026-09-06", "items": [{"filed": "2020-02-25", "siblings": 4, "sibling_index": 4, "text": "当社は、東京証券取引所より2018年９月１日に特設注意市場銘柄に指定され、以後、内部管理体制の改善に取り\n\n組んでおります。\n\nその中で、当社は、決算開示体制強化の一環として、第32期（自平成28年４月１日至平成29年３月31日）以\n\n降に提出いたしました有価証券報告書、四半期報告書の自主点検を行いました。\n\nこの結果、連結財務諸表、及び財務諸表における貸借対照表、損益計算書への影響はありませんが、当社が、平成\n\n29年６月30日に提出いたしました第32期（自平成28年４月1日至平成29年３月31日）有価証券報告書の記載事項\n\nの一部に訂正すべき箇所がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出するものであ\n\nります。\n\n２", "in_window": true, "ref": "01"}, {"filed": "2018-09-21", "siblings": 1, "sibling_index": 1, "text": "平成30年９月19日に提出いたしました第70期（自平成29年６月21日至平成30年６月20日）有価証券報告書の\n\n添付書類の定款につき、添付すべき定款に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書\n\nEDINET提出書類\n\n株式会社キングジム(E02398)\n\n訂正有価証券報告書\n\nを提出するものであります。\n\n２", "in_window": true, "ref": "02"}, {"filed": "2018-01-25", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の連結子会社であるソフィアデジタル株式会社において売上の過大計上など過年度決算の訂正の対象と\n\nなり得る不適切な会計処理が行われていることが判明し、同日に社外役員による内部調査委員会を設置し、事実関係の\n\n確認とその根本的な原因の解明に努めてまいりました。\n\n平成29年12月22日に内部調査委員会による調査報告書を受領し、その調査結果をふまえ、売上高及び売上原価の取消\n\nし、棚卸資産の商品評価損の計上等を行うことを決定し、過年度の決算について訂正することと致しました。\n\n以上の結果、当社は、これまでに判明した事象、及びその他重要性の観点から修正を行わなかった事項の修正等を含\n\nめ、第39期（自平成25年４月１日至平成26年３月31日）から第42期（自平成28年４月１日至平成29年３月\n\n31日）までの有価証券報告書、第40期（自平成26年４月１日至平成27年３月31日）から第41期（自平成27年４\n\n月１日至平成28年３月31日）までの四半期報告書の訂正を行います。\n\nこれらの決算訂正により、当社が平成29年６月27日に提出いたしました第42期（自平成28年４月１日至平成29\n\n年３月31日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定\n\nに基づき、有価証券報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "03"}, {"filed": "2020-09-04", "siblings": 2, "sibling_index": 2, "text": "当社は、過年度の退職給付債務の会計上の見積りの前提を見直した結果、見積りの前提に誤りがあり、退職給付債務\n\nを過小に計上していたことが判明しましたので、過去に提出した有価証券報告書等に記載されている連結財務諸表及び\n\n財務諸表並びに四半期連結財務諸表に含まれる一連の誤謬を訂正することといたしました。また、その見積りの前提の\n\n見直しが必要となった要因が、平成26年３月期以前であることが判明したことから平成27年３月期決算の期首に遡及し\n\nて訂正いたします。上記以外の誤謬についても過年度の連結財務諸表及び財務諸表並びに四半期連結財務諸表を見直し\n\nて必要と認められる訂正を行いました。\n\nこれらの決算訂正により、平成29年６月29日に提出いたしました第71期（自平成28年４月１日至平成29年３月\n\n31日）有価証券報告書及び平成31年３月29日に提出いたしました第71期有価証券報告書の訂正報告書の記載事項の一部\n\nを訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を\n\n提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任監査法人トーマツにより監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "04"}, {"filed": "2022-08-22", "siblings": 2, "sibling_index": 1, "text": "当社は、今般、証券取引等監視委員会から、過年度に提出いたしました有価証券報告書及び四半期報告書について、\n\n訂正報告書を提出すべきとの指摘を受けました。\n\n訂正の対象及びその訂正の要否については、当時慎重に検討のうえ不要と判断し、有価証券報告書及び四半期報告書\n\nを提出しておりましたが、今般の証券取引等監視委員会からの重要性があるため訂正の必要性があるとの指摘をふま\n\nえ、有価証券報告書の訂正報告書を提出することにいたしました。\n\nこれにより、第51期（自2020年１月１日至2020年12月31日）の連結財務諸表及び財務諸表の金額を修正した結\n\n果、当社が2022年３月30日に提出いたしました第52期（自2021年１月１日至2021年12月31日）に係る有価証券報\n\n告書の比較情報の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づき、有価証券\n\n報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "05"}, {"filed": "2024-05-31", "siblings": 3, "sibling_index": 3, "text": "当社は、当社の元取締役で子会社の㈱東京衡機エンジニアリングの元代表取締役である者が外注先に対する製造委\n\n託料の水増しを行い、外注先等を介して関係者に水増し分のキックバックを行っていた疑いを知り、2023年12月28日\n\nに外注先から関連する資料を受領したことから、会計監査人である監査法人アリアと協議したうえで、2024年２月27\n\n日に調査委員会を設置し、本件不正行為の有無に関する事実解明のための調査を進めてまいりました。\n\n2024年３月29日付で調査委員会の調査報告書を受領し、調査の結果、本件不正行為は当社が㈱東京衡機エンジニア\n\nリングを会社分割により新設する前の2016年10月から開始され2023年４月まで行われたこと、水増し金額の合計は\n\n254,048千円（税込）であったことなどが判明し、外注先への製造委託料が本来の請求額から水増しされている場合、\n\n水増しされた金額は本来の原価性を有せず、意図的な水増し行為を行った者に対しては返還を請求すべき金額であ\n\nり、水増しされた取引の属する会計期間において、原価を取消して未収入金（請求権）として計上すべきであり、当\n\n該未収入金は回収可能性を勘案して貸倒引当金の計上を検討すべきであるとの会計上の評価を受けたことから、2017\n\n年２月期以降の財務報告において訂正を要する事項があると認め、過年度の決算を訂正いたしました。\n\nこれらの決算訂正により、当社が2019年５月30日に提出し、2023年３月８日及び2023年３月24日に訂正報告書を提\n\n出いたしました第113期（自2018年３月１日至2019年２月28日）有価証券報告書の一部を訂正する必要が生じま\n\nしたので、金融商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものでありま\n\nす。\n\nなお、訂正後の連結財務諸表及び財務諸表については、監査法人アリアの監査を受けており、その監査報告書を添\n\n付しております。\n\n２", "in_window": true, "ref": "06"}, {"filed": "2023-03-31", "siblings": 1, "sibling_index": 1, "text": "2021年６月30日に提出いたしました第107期（自2020年４月１日至2021年３月31日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社大泉製作所(E26216)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "07"}, {"filed": "2021-06-25", "siblings": 1, "sibling_index": 1, "text": "2020年６月23日に提出した第68期（自2019年４月１日至2020年３月31日）有価証券報告書の記載事項の一部に\n\n誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n日鉄興和不動産株式会社(E11467)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "08"}, {"filed": "2019-12-16", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の連結子会社であるフィリピン共和国所在の東洋インキコンパウンズ株式会社（以下「TICC」といい\n\nます。）において、同社のフィリピン人社員により不適切な会計処理が行われていた可能性があることが判明したた\n\nめ、外部の専門家を含む特別調査委員会（以下「本特別調査委員会」といいます。）を設置し、全容解明と根本的な\n\n原因の究明に努め、類似する案件の存否についての調査も進めてまいりました。\n\n2019年12月11日に受領した本特別調査委員会による調査結果を踏まえ、TICCにおける不適切な会計処理が実施され\n\nていた、たな卸資産、買掛金、借入金等について、過年度の訂正を行うとともに、その影響により、TICCの固定資産\n\nの減損処理等も実施し、過年度の当社連結財務諸表を訂正しました。また、TICCの訂正後の財政状態を勘案し、過年\n\n度の当社個別財務諸表において、関係会社投資損失引当金を訂正計上しております。\n\nこれに伴い、当社が2019年３月26日に提出いたしました第181期（自2018年１月１日至2018年12月31日）に係\n\nる有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基\n\nづき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任監査法人トーマツにより監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "09"}, {"filed": "2019-09-18", "siblings": 1, "sibling_index": 1, "text": "当社の2019年６月期中に、過年度における勤怠管理が適切に行われていなかった事実が判明いたしましたので、2017\n\n年３月から2019年２月の２年間にわたり、従業員からの申告に基づいて未払い残業代（給与分）、総額143百万円を支払\n\nうことと致しました。\n\nまた、セグメント情報等のセグメント利益の計算において、売上原価、販売費及び一般管理費のセグメント区分に誤\n\nりがあったため、T&amp;LD事業のセグメント利益が584百万円、HRM事業のセグメント利益が529百万円過小となっており、調\n\n整額が1,113百万円過大となっておりました。\n\n当該計上誤りには金額的な重要性が認められるため、過去に提出いたしました有価証券報告書に記載されている連結\n\n財務諸表及び財務諸表を訂正することといたしました。\n\nこれらの訂正により、当社が2017年９月28日に提出いたしました第26期（自2016年４月１日至2017年６月30\n\n日）に係る有価証券報告書の一部を訂正する必要性が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、青南監査法人により監査を受けており、その監査報告書を添\n\n付しております。\n２", "in_window": true, "ref": "10"}, {"filed": "2018-12-14", "siblings": 1, "sibling_index": 1, "text": "平成31年３月期に係る第２四半期決算手続中に、監査法人から貸倒引当金の十分性の検証を行うよう指示がありま\n\nした。これを受け、当社として検証した結果、貸倒引当金の算定方法を債権の発生期間別で区分する方法から、債務\n\n者別等で区分する方法に変更することといたしましたが、変更後の方法は過年度にさかのぼって適用することが妥当\n\nであることが判明したため、過年度の決算を訂正することといたしました。\n\nこれらの決算訂正により、当社が平成29年６月30日に提出いたしました第14期(自平成28年４月１日至平成29\n\n年３月31日)に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第\n\n１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、EY新日本有限責任監査法人より監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "11"}, {"filed": "2021-07-14", "siblings": 3, "sibling_index": 1, "text": "当社は、2021年６月21日に公表いたしました「第三者委員会の最終調査報告書公表及び役員報酬の減額に関するお\n\n知らせ」にてお知らせしましたとおり、当社の元役員による資金流用及び不適切な会計処理が行われていた可能性が\n\nあることが判明したため、この事実を重く受け止め、社外有識者のみを委員とする第三者委員会を設置し、本件に関\n\nする全容解明のため事実関係の調査を行い、当社は第三者委員会による追加調査に全面的に協力してまいりました。\n\n第三者委員会の調査の結果、資金流用及び不適切な会計処理が判明したため、過去に提出した有価証券報告書等に\n\n含まれる連結財務諸表及び財務諸表並びに四半期連結財務諸表及び四半期財務諸表に含まれる一連の会計処理を訂正\n\nすることといたしました。\n\nこの訂正により、当社が2021年３月29日に提出いたしました第14期（自2020年１月１日至2020年12月31日）\n\nに係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づき、\n\n有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任監査法人トーマツの監査を受けており、その監査\n\n報告書を添付しております。\n\n２", "in_window": true, "ref": "12"}, {"filed": "2019-11-07", "siblings": 3, "sibling_index": 1, "text": "2019年６月14日に提出いたしました第32期（自2018年４月１日至2019年３月31日）有価証券報告書の記載事項\n\nの一部に訂正すべき事項がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出するものであり\n\nEDINET提出書類\n\nネットワンシステムズ株式会社(E04966)\n\n訂正有価証券報告書\n\nます。\n\n２", "in_window": true, "ref": "13"}, {"filed": "2025-01-10", "siblings": 2, "sibling_index": 2, "text": "当社は、外部機関による調査（資料の提出、ヒアリング）の過程において、当社が保有する投資有価証券（暗号資\n\n産転換可能社債）、暗号資産関連の取引及び水まわりサービス支援事業における取引に関して、過年度より不正確な\n\n会計処理が行われていた可能性を指摘されたことから、当社は、本事案の実態解明を行い、当社と利害関係を有しな\n\nい外部の専門家からなる特別調査委員会を設置して本事案の調査を行ってまいりました。\n\n当社グループは、2024年９月18日に特別委員会から調査報告書を受領した結果、当社と特定の加盟店との間での水\n\nまわりサービス支援事業に関する債権債務の決済取引に関して、当社代表取締役社長の主導によって、その一部に当\n\n社代表取締役の自己資金を原資とする取引が含まれており、また、その他に当社が管理する他の加盟店の銀行口座等\n\nを通過させる取引等も含まれているという報告を受け、その経済的実態は資金移動取引であることが判明いたしまし\n\nた。加えて、特定の加盟店に対する水まわりサービス支援事業の売上高の取引価格の算定に誤りがあることが判明い\n\nたしました。また、これらに関連して、貸倒引当金の算定に誤りがあることが判明いたしました。さらに、当社が保\n\n有する投資有価証券（暗号資産転換可能社債）の評価及び暗号資産の処分見込価額の見積りについては、保有区分の\n\n見直し等に伴う評価方法の見直しを提言されました。\n\nこのため、当社は過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四半\n\n期連結財務諸表等で対象となる部分について、訂正することといたしました。訂正に際しては、当社内の自主点検に\n\nより判明した事項及びその他重要性の観点から過年度において修正を行わなかった事項も併せて訂正を行っておりま\n\nす。\n\nこれらの決算訂正により、当社が2022年５月31日に提出いたしました第27期（自2021年３月１日至2022年２\n\n月28日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第1項\n\nの規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、HLBMeisei有限責任監査法人により監査を受けており、そ\n\nの監査報告書を添付しております。\n\n２", "in_window": true, "ref": "14"}, {"filed": "2024-05-31", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の元取締役で子会社の㈱東京衡機エンジニアリングの元代表取締役である者が外注先に対する製造委\n\n託料の水増しを行い、外注先等を介して関係者に水増し分のキックバックを行っていた疑いを知り、2023年12月28日\n\nに外注先から関連する資料を受領したことから、会計監査人である監査法人アリアと協議したうえで、2024年２月27\n\n日に調査委員会を設置し、本件不正行為の有無に関する事実解明のための調査を進めてまいりました。\n\n2024年３月29日付で調査委員会の調査報告書を受領し、調査の結果、本件不正行為は当社が㈱東京衡機エンジニア\n\nリングを会社分割により新設する前の2016年10月から開始され2023年４月まで行われたこと、水増し金額の合計は\n\n254,048千円（税込）であったことなどが判明し、外注先への製造委託料が本来の請求額から水増しされている場合、\n\n水増しされた金額は本来の原価性を有せず、意図的な水増し行為を行った者に対しては返還を請求すべき金額であ\n\nり、水増しされた取引の属する会計期間において、原価を取消して未収入金（請求権）として計上すべきであり、当\n\n該未収入金は回収可能性を勘案して貸倒引当金の計上を検討すべきであるとの会計上の評価を受けたことから、2017\n\n年２月期以降の財務報告において訂正を要する事項があると認め、過年度の決算を訂正いたしました。\n\nこれらの決算訂正により、当社が2023年５月26日に提出いたしました第117期（自2022年３月１日至2023年２\n\n月28日）有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、監査法人アリアの監査を受けており、その監査報告書を添\n\n付しております。\n\n２", "in_window": true, "ref": "15"}, {"filed": "2023-03-31", "siblings": 2, "sibling_index": 2, "text": "当社は、特定の取引先との取引に関連し、過年度決算における会計上の連結対象範囲の判断等についての疑義が判\n\n明したため、2023年1月16日に特別調査委員会を設置し調査を実施いたしました。特別調査委員会の調査結果について\n\nは、2023年3月7日付「特別調査委員会の調査報告書公表に関するお知らせ」にて開示しております。当社は、特別調\n\n査委員会による調査結果を踏まえ、再発防止策を策定し、再発防止に努めております。\n\n当社としては、これまでに提出した有価証券報告書等について訂正を要するまでには至らないと判断しております\n\nが、上記の調査過程において判明した一連の事実を踏まえ、会計監査人であるEY新日本有限責任監査法人から、これ\n\nまでに同法人から受領した第39期（自2019年12月１日至2020年11月30日）以降のすべての四半期レビュー報告書及\n\nび監査報告書（以下「監査報告書等」という。）について、限定付結論及び限定付適正意見を付したものへ修正する\n\n監査報告書等を受領いたしました。\n\nそこで2021年２月26日に提出した第39期（自2019年12月１日至2020年11月30日）有価証券報告書に添付されてい\n\nた監査報告書を差し替えるために有価証券報告書の訂正報告書を提出するものであります。\n\nなお、その他、有価証券報告書の記載事項の一部に訂正すべき事項がありましたので、併せて訂正しております。\n\n２", "in_window": true, "ref": "16"}, {"filed": "2023-08-16", "siblings": 2, "sibling_index": 2, "text": "当社は、2023年６月20日付け「当社に対する東京都公安委員会からの勧告及び代表取締役社長その他取締役の異動\n\nについて」及び同月29日付け「2023年６月20日付け適時開示の補足説明について」にて公表しましたとおり、2021年\n\n３月25日、当時代表取締役であった小池信三氏が、当社が解体工事を発注した業者に工事代金支払のため発行し交付\n\nした小切手約189万円を、第三者を介すなどして東京都暴排条例に定める規制対象者である指定暴力団住吉会系の暴力\n\n団組員（以下「本規制対象者」といいます。）に交付した事実を原因として、2023年６月20日、東京都公安委員会か\n\nら勧告を受け、同日中に、当社経営に対する同氏の影響を排除するため、当時代表取締役社長であった小池学氏及び\n\n取締役であった吉野満氏両名の辞任（なお、吉野満氏は当社の従業員を兼務しておりましたが、従業員としての雇用\n\n関係も同時に終了しており、それ以後、当社と両者との間には何らの契約関係もありません。）を了承するととも\n\nに、千葉理恵を代表取締役社長に選任しました。なお、両者の辞任以降、両者と会社の間に会社運営に影響を与える\n\n一切の関係はありません。\n\nそして、当社は、2023年６月22日付け「第三者委員会の設置について」にて公表しましたとおり、上記事実に関す\n\nる調査、類似する事案の有無に関する調査、本件に関する当社のコンプライアンス体制及びコーポレート・ガバナン\n\nス体制の状況、原因究明及び再発防止策の提言を目的として、2023年６月22日開催の取締役会において、第三者委員\n\n会を設置することを決議しました。同日より第三者委員会による調査が開始され、当社は同調査に協力してまいりま\n\nしたが、2023年８月14日、その調査結果として同日付け調査報告書を受領いたしました。\n\n上記第三者委員会による調査結果により、東京都公安委員会から勧告を受けた事案は、小池信三氏が本規制対象者\n\nと個人的な交流があったことで当社が利用されたものであり、会社ぐるみとの認定はなされておりませんが、小池信\n\n三氏が、当社の創業者であり、筆頭株主であるとともに、当時代表取締役でもあったという特殊な事情から、同氏が\n\n関与する取引の一部については、取締役会、監査役会、内部監査室、コンプライアンス委員会及びリスク管理委員会\n\nによる統制が機能していない不備が生じており、結果として内部統制が有効に機能していなかったものです。以上の\n\nとおり、当社のコンプライアンス体制及びコーポレート・ガバナンス体制に不十分な点が認められたことから、過去\n\nに提出した有価証券報告書に記載されておりますコーポレート・ガバナンスの状況等の部分について訂正することと\n\nいたしました。\n\nまた、東京都公安委員会からの勧告に関連した警察当局からの捜査協力として、取引を精査している過程で、勧告\n\nの事実とは別に、過年度の一部の収益不動産の販売取引について、売上計上時期の適切性の検討を要する事象が発見\n\nされたことから、当社において本件取引について調査を実施した結果、売上計上の時期について不適切な会計処理が\n\nなされていることが発覚しましたので、当社の会計監査人である太陽有限責任監査法人と決算処理について協議を行\n\nい、過年度決算の訂正を行うこととしました。当該取引は、当時の代表取締役社長小池信三氏が、2018年８月に、当\n\n時当社が保有していた収益不動産５物件について、合計約32億円で、販売先に対し口頭で、当該収益不動産は当社が\n\n責任をもって転売先を見つけ、売却する旨約し、販売したところ、小池信三氏がかかる口頭合意の存在を、経理を担\n\n当する当社管理部門に秘していたため、当社管理部門は当該取引を当該口頭合意のない単純な売買契約と誤認し、\n\n2018年８月に売上を計上したものであります。かかる口頭合意の存在する状況では、2018年8月の販売先への販売の時\n\n点では、当社には、依然として当該収益不動産の転売先を見つけ、売却する義務が残っているため、財の移転が完全\n\nに移転したとはいえないため、実現主義の原則からは、2018年８月の当社による販売の時点では売上を計上するのは\n\n適切ではなく、実際に販売責任を果たし（当社が転売先を見つけ、当該収益不動産を転売先に売却できたとき）、実\n\n現主義の原則の２要件である財の移転及び対価の授受を満たした（上記口頭合意を履行した）2019年11月時点で売上\n\nを計上すべきであったと判断し、過年度決算の訂正を行うこととしました。\n\nこれらの訂正により、2018年11月30日提出（2019年１月16日一部訂正）の第25期有価証券報告書(自2017年９月１\n\n日至2018年８月31日)、2019年11月27日提出（2020年４月21日一部訂正）の第26期有価証券報告書(自2018年９\n\n月１日至2019年８月31日)、2020年11月27日提出の第27期有価証券報告書(自2019年９月１日至2020年８月\n\n31日)の記載事項の決算数値の一部に訂正すべき事項がありましたので、金融商品取引法第24条の2第１項の規定に基\n\nづき、有価証券報告書の訂正報告書を提出するものであります。また、当該訂正を受け、2021年11月30日提出の第28\n\n期有価証券報告書(自2020年９月１日至2021年８月31日)および2022年11月30日提出の第29期有価証券報告書(自\n\n2021年９月１日至2022年８月31日)について、主要な経営指標等の推移並びに比較情報の一部に訂正すべき事項\n\nがありましたので、金融商品取引法第24条の2第１項の規定に基づき、有価証券報告書の訂正報告書を提出するもので\n\nあります。加えて、当該訂正を受け、2021年１月12日提出の第28期第１四半期(自2020年９月１日至2020年11月\n\n30日)、2021年４月12日提出の第28期第２四半期(自2020年12月１日至2021年２月28日)および2021年７月13日提\n\n2/121\n\n\f出の第28期第３四半期(自2021年３月１日至2022年５月31日)について、主要な経営指標等の推移並びに比較情\n\n報の一部に訂正すべき事項がありましたので、金融商品取引法第24条の４の７第４項の規定に基づき、四半期報告書\n\nの訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、太陽有限責任監査法人の監査を受けており、その監査報告\n\nEDINET提出書類\n\n株式会社三栄建築設計(E04059)\n\n訂正有価証券報告書\n\n書を添付しております。\n\n２", "in_window": true, "ref": "17"}, {"filed": "2025-05-02", "siblings": 1, "sibling_index": 1, "text": "2024年６月28日に提出いたしました第51期（自2023年４月１日至2024年３月31日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\nエブレン株式会社(E35555)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "18"}, {"filed": "2020-12-16", "siblings": 3, "sibling_index": 3, "text": "当社は、2019年11月14日、東京国税局による税務調査の過程で、当社の一部取引について納品の事実が確認できない\n\n疑義があるとの指摘を受けたことを端緒に、特別調査委員会による調査を実施し、2020年３月12日に「納品実体のない\n\n取引に関する調査最終報告書」を受領し、その結果に基づき、過年度の当社連結財務諸表及び財務諸表を訂正いたしま\n\nした。\n\nしかしながら、その後、外部機関からの指摘があり、資金流用の疑義及び資金流用を実行した目的のひとつとして、\n\n仕入先及び売上先を利用した原価の付替え行為が行われていた可能性を認識したため、当社とは利害関係を有しない外\n\n部の弁護士及び公認会計士で構成される外部調査委員会を設置いたしました。\n\nさらに、納品実体のない取引により、当社から複数業者へ流出した資金の一部が、当社が売上として計上した取引に\n\nかかる役務や物品の提供に充てられていた可能性があるとの疑義が判明したため、社内調査を行いました。\n\n2020年12月14日に外部調査委員会の「調査報告書」及び社内調査チームの社内調査報告書を受領し、①当社元従業員\n\nが仕入先を利用して資金を流用していたこと（累計では206百万円）、②売上先を利用した不正な原価付替が行われて\n\nいたこと（累計では16百万円）、③納品実体のない取引に関連する立替金約51億円の損失計上方法が誤っていたこと\n\n（累計では金額の影響なし）、及び、④納品実体のない取引により流出した資金の一部が当社への役務や物品の提供に\n\n充てられていたこと（累計では1,569百万円）、等についての報告を受けました。\n\n当社は、報告内容を検討の結果、①当社元従業員による資金流用の金額については売上原価から営業外費用への振替\n\n処理による訂正、②売上先を利用して付替を行った原価については売上原価から販売費及び一般管理費への振替処理に\n\nよる訂正、③立替金約51億円の損失処理については従来31期から第33期の３期間にわたって特別損失を計上していたと\n\nころ納品実体のない取引が行われた期間である第29期から第33期の期間にわたって損失計上を行う訂正、及び、④流出\n\nした資金のうち当社への役務や物品の提供に充てられていた金額については該当期間の売上原価の計上、または特別損\n\n失から売上原価への振替処理による訂正、を行うこととしました。\n\n当該訂正により、第32期においては、売上原価から営業外費用へ21百万円の振替処理、売上原価から販売費及び一般\n\n管理費へ13百万円の振替処理、特別利益3,182百万円の計上、及び売上原価279百万円の追加計上をしております。\n\nこれらの決算訂正により、当社が2020年３月13日に提出しました第32期（自2018年４月１日至2019年３月31\n\n日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任監査法人トーマツにより監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "19"}, {"filed": "2022-05-11", "siblings": 3, "sibling_index": 2, "text": "当社は、2021年６月21日に公表いたしました「第三者委員会の最終調査報告書公表及び役員報酬の減額に関するお\n\n知らせ」にてお知らせしましたとおり、当社の元役員による資金流用及び不適切な会計処理が行われていた可能性が\n\nあることが判明したため、この事実を重く受け止め、社外有識者のみを委員とする第三者委員会を設置し、本件に関\n\nする全容解明のため事実関係の調査を行い、当社は第三者委員会による追加調査に全面的に協力してまいりました。\n\n第三者委員会の調査の結果、資金流用及び不適切な会計処理が判明したため、過去に提出した有価証券報告書等に\n\n含まれる連結財務諸表及び財務諸表並びに四半期連結財務諸表及び四半期財務諸表に含まれる一連の会計処理を訂正\n\nし、2021年7月14日に有価証券報告書の訂正報告書を提出いたしました。\n\nしかしながら、2022年2月1日付「第三者委員会の設置及び2021年12月期決算発表の延期に関するお知らせ」にてお\n\n知らせしましたとおり、当社台湾子会社における過去の取引が架空売上であった疑義やその他当社における過去の売\n\n上・費用等の計上時期が適切な期に計上されていない等の不適切な会計処理の疑義が発覚し、再び第三者委員会によ\n\nる調査を行いました。\n\n当該第三者委員会の調査結果は、2022年4月11日付「第三者委員会の調査報告書の公表について」にて公表しました\n\nとおりですが、当該調査によって過年度における不適切な会計処理が判明したため、過去に提出した有価証券報告\n\n書・四半期報告書（過去に提出した訂正有価証券報告書・訂正四半期報告書も含む）に含まれる連結財務諸表及び財\n\n務諸表並びに四半期連結財務諸表及び四半期財務諸表に含まれる一連の会計処理を訂正することとなりました。\n\nこの訂正により、当社が2021年７月14日に提出いたしました第14期（自2020年１月１日至2020年９月30日）\n\nに係る訂正有価証券報告書の一部を再び訂正する必要が生じましたので、金融商品取引法第24条の４の７第４項の規\n\n定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表については、監査法人アリアの監査を受けており、その監査報告書を添付しておりま\n\nす。\n\n２", "in_window": true, "ref": "20"}, {"filed": "2022-02-24", "siblings": 2, "sibling_index": 1, "text": "2021年２月26日に提出いたしました第39期（自2019年12月１日至2020年11月30日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\nサムティ株式会社(E04074)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "21"}, {"filed": "2023-02-10", "siblings": 2, "sibling_index": 1, "text": "2022年７月29日に提出いたしました第112期（自2021年４月１日至2022年３月31日）有価証券報告書に添付し\n\nております「独立監査人の監査報告書及び内部統制監査報告書」の記載事項の一部に誤りがありましたので、これを\n\n訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "22"}, {"filed": "2020-04-21", "siblings": 2, "sibling_index": 1, "text": "2019年11月27日に提出いたしました第27期（自2018年９月１日至2019年８月31日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社三栄建築設計(E04059)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "23"}, {"filed": "2018-12-03", "siblings": 1, "sibling_index": 1, "text": "当社は、平成30年９月３日に外部から指摘を受け、過去の映像事業における一部の案件に関して、売上計上の妥当性\n\n等に疑義が生じていることが判明しました。これを受け、当社は、より独立した立場から、事実関係の解明、これらの\n\n会計処理の妥当性に関する検証、再発防止策に関する提言等の見解を求める必要があると判断したため、平成30年９月\n\n14日付で外部の専門家による第三者委員会を設置し調査を行い、平成30年11月27日付で第三者委員会から調査結果の報\n\n告を受けました。当社は、当該調査結果を踏まえ、当社の映像制作事業における、売上高の取消し等の訂正を行うこと\n\nといたしました。\n\nこれらを訂正するため、金融商品取引法第24条の２第１項の規定に基づき、平成29年９月25日に提出いたしました第\n\n16期（自平成28年７月１日至平成29年６月30日）に係る有価証券報告書の訂正報告書を提出するものでありま\n\nす。\n\nなお、訂正後の連結財務諸表及び財務諸表について、有限責任あずさ監査法人による監査を受けており、監査報告\n\n書を添付しております。\n\nまた、連結財務諸表及び財務諸表の記載内容に係る訂正箇所については、XBRLの修正も行いましたので、修正後の\n\nXBRL形式データ一式（表示情報ファイル含む）を提出致します。\n\n２", "in_window": true, "ref": "24"}, {"filed": "2020-11-27", "siblings": 1, "sibling_index": 1, "text": "2020年８月14日に提出いたしました第53期（自2019年４月１日至2020年３月31日）有価証券報告書の記載事項\n\nの一部に訂正すべき事項がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出いたします。\n\nユー・エム・シー・エレクトロニクス株式会社(E32169)\n\n訂正有価証券報告書\n\nEDINET提出書類\n\n２", "in_window": true, "ref": "25"}, {"filed": "2023-08-16", "siblings": 2, "sibling_index": 2, "text": "当社は、2023年６月20日付け「当社に対する東京都公安委員会からの勧告及び代表取締役社長その他取締役の異動\n\nについて」及び同月29日付け「2023年６月20日付け適時開示の補足説明について」にて公表しましたとおり、2021年\n\n３月25日、当時代表取締役であった小池信三氏が、当社が解体工事を発注した業者に工事代金支払のため発行し交付\n\nした小切手約189万円を、第三者を介すなどして東京都暴排条例に定める規制対象者である指定暴力団住吉会系の暴力\n\n団組員（以下「本規制対象者」といいます。）に交付した事実を原因として、2023年６月20日、東京都公安委員会か\n\nら勧告を受け、同日中に、当社経営に対する同氏の影響を排除するため、当時代表取締役社長であった小池学氏及び\n\n取締役であった吉野満氏両名の辞任（なお、吉野満氏は当社の従業員を兼務しておりましたが、従業員としての雇用\n\n関係も同時に終了しており、それ以後、当社と両者との間には何らの契約関係もありません。）を了承するととも\n\nに、千葉理恵を代表取締役社長に選任しました。なお、両者の辞任以降、両者と会社の間に会社運営に影響を与える\n\n一切の関係はありません。\n\nそして、当社は、2023年６月22日付け「第三者委員会の設置について」にて公表しましたとおり、上記事実に関す\n\nる調査、類似する事案の有無に関する調査、本件に関する当社のコンプライアンス体制及びコーポレート・ガバナン\n\nス体制の状況、原因究明及び再発防止策の提言を目的として、2023年６月22日開催の取締役会において、第三者委員\n\n会を設置することを決議しました。同日より第三者委員会による調査が開始され、当社は同調査に協力してまいりま\n\nしたが、2023年８月14日、その調査結果として同日付け調査報告書を受領いたしました。\n\n上記第三者委員会による調査結果により、東京都公安委員会から勧告を受けた事案は、小池信三氏が本規制対象者\n\nと個人的な交流があったことで当社が利用されたものであり、会社ぐるみとの認定はなされておりませんが、小池信\n\n三氏が、当社の創業者であり、筆頭株主であるとともに、当時代表取締役でもあったという特殊な事情から、同氏が\n\n関与する取引の一部については、取締役会、監査役会、内部監査室、コンプライアンス委員会及びリスク管理委員会\n\nによる統制が機能していない不備が生じており、結果として内部統制が有効に機能していなかったものです。以上の\n\nとおり、当社のコンプライアンス体制及びコーポレート・ガバナンス体制に不十分な点が認められたことから、過去\n\nに提出した有価証券報告書に記載されておりますコーポレート・ガバナンスの状況等の部分について訂正することと\n\nいたしました。\n\nまた、東京都公安委員会からの勧告に関連した警察当局からの捜査協力として、取引を精査している過程で、勧告\n\nの事実とは別に、過年度の一部の収益不動産の販売取引について、売上計上時期の適切性の検討を要する事象が発見\n\nされたことから、当社において本件取引について調査を実施した結果、売上計上の時期について不適切な会計処理が\n\nなされていることが発覚しましたので、当社の会計監査人である太陽有限責任監査法人と決算処理について協議を行\n\nい、過年度決算の訂正を行うこととしました。当該取引は、当時の代表取締役社長小池信三氏が、2018年８月に、当\n\n時当社が保有していた収益不動産５物件について、合計約32億円で、販売先に対し口頭で、当該収益不動産は当社が\n\n責任をもって転売先を見つけ、売却する旨約し、販売したところ、小池信三氏がかかる口頭合意の存在を、経理を担\n\n当する当社管理部門に秘していたため、当社管理部門は当該取引を当該口頭合意のない単純な売買契約と誤認し、\n\n2018年８月に売上を計上したものであります。かかる口頭合意の存在する状況では、2018年8月の販売先への販売の時\n\n点では、当社には、依然として当該収益不動産の転売先を見つけ、売却する義務が残っているため、財の移転が完全\n\nに移転したとはいえないため、実現主義の原則からは、2018年８月の当社による販売の時点では売上を計上するのは\n\n適切ではなく、実際に販売責任を果たし（当社が転売先を見つけ、当該収益不動産を転売先に売却できたとき）、実\n\n現主義の原則の２要件である財の移転及び対価の授受を満たした（上記口頭合意を履行した）2019年11月時点で売上\n\nを計上すべきであったと判断し、過年度決算の訂正を行うこととしました。\n\nこれらの訂正により、2018年11月30日提出（2019年１月16日一部訂正）の第25期有価証券報告書(自2017年９月１\n\n日至2018年８月31日)、2019年11月27日提出（2020年４月21日一部訂正）の第26期有価証券報告書(自2018年９\n\n月１日至2019年８月31日)、2020年11月27日提出の第27期有価証券報告書(自2019年９月１日至2020年８月\n\n31日)の記載事項の決算数値の一部に訂正すべき事項がありましたので、金融商品取引法第24条の2第１項の規定に基\n\nづき、有価証券報告書の訂正報告書を提出するものであります。また、当該訂正を受け、2021年11月30日提出の第28\n\n期有価証券報告書(自2020年９月１日至2021年８月31日)および2022年11月30日提出の第29期有価証券報告書(自\n\n2021年９月１日至2022年８月31日)について、主要な経営指標等の推移並びに比較情報の一部に訂正すべき事項\n\nがありましたので、金融商品取引法第24条の2第１項の規定に基づき、有価証券報告書の訂正報告書を提出するもので\n\nあります。加えて、当該訂正を受け、2021年１月12日提出の第28期第１四半期(自2020年９月１日至2020年11月\n\n30日)、2021年４月12日提出の第28期第２四半期(自2020年12月１日至2021年２月28日)および2021年７月13日提\n\n2/124\n\n\f出の第28期第３四半期(自2021年３月１日至2022年５月31日)について、主要な経営指標等の推移並びに比較情\n\n報の一部に訂正すべき事項がありましたので、金融商品取引法第24条の４の７第４項の規定に基づき、四半期報告書\n\nの訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、太陽有限責任監査法人の監査を受けており、その監査報告\n\nEDINET提出書類\n\n株式会社三栄建築設計(E04059)\n\n訂正有価証券報告書\n\n書を添付しております。\n\n２", "in_window": true, "ref": "26"}, {"filed": "2017-06-30", "siblings": 4, "sibling_index": 1, "text": "平成29年6月29日に提出いたしました第32期（自平成28年4月1日至平成29年3月31日）有価証券報告書に添付\n\nしております監査報告書に原本と一部異なる記載がありましたので、これを訂正するため有価証券報告書の訂正報告\n\n書を提出するものであります。\n\nなお、訂正後の監査報告書の原本を電子化したものを添付しております。\n\nEDINET提出書類\n\n株式会社省電舎(E05452)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "27"}, {"filed": "2021-01-12", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の創業者である元代表取締役社長が設立し運営する株式会社ひらまつ総合研究所（以下「ひらまつ総\n\n研」といいます。）等との間の取引に関し、外部調査委員会に委嘱し調査を行って参りました（以下「本件調査」と\n\nいいます。）。その結果、２つの店舗の譲渡（以下「本件譲渡」といいます。）に関連して、ひらまつ総研との間で\n\n取締役会の承認なく２つの業務委託契約（以下「本件業務委託契約」といいます。）を締結しており、本件業務委託\n\n契約には、ひらまつ総研に業務委託報酬の名目で本件譲渡の対価の支払原資を供与して資金を還流させる目的があ\n\nり、また、本件譲渡の代金を将来的に条件付きで280百万円減額する旨の覚書（以下「本件覚書」といいます。）を取\n\n締役会の承認なく締結していたことが判明しました。また、本件業務委託契約及び本件覚書を当社の会計監査人に秘\n\n匿して財務諸表を作成していたことも判明しました。この他、調査の過程で業務委託報酬等（以下「本件業務委託報\n\n酬等」といいます。）に関する会計処理及び開示の誤謬が判明しました。\n\n当社は、上記の資金還流目的や当時の経営者が本件業務委託契約及び本件覚書の存在を会計監査人に秘匿して財務\n\n諸表を作成した経緯等に照らして、経営者による不正な財務報告があったと認識しております。当社としては、本件\n\n調査の結果も踏まえ、本件譲渡は対価性の観点から実質のない譲渡であり、会計上正当な売却取引があったとは認め\n\nられないことから、本件譲渡を売却取引として会計処理するのは適切ではないと判断し、当社の固定資産として貸借\n\n対照表に計上したうえで必要に応じて減損処理を行うとともに、本件業務委託報酬等の会計処理及び開示を訂正する\n\nことといたしました。\n\nまた、会計監査人から固定資産の減損の兆候判定において使用する各店舗の損益の算定にあたって実施されている\n\n店舗間の費用の振替に関する質問を受けて社内調査を実施した結果、店舗間の人件費の不正な振替が行われており、\n\n店舗に係る固定資産の減損を回避していることが判明しました。そのため、当該店舗の固定資産の減損損失の計上と\n\nその後の減価償却費の計上等の一連の会計処理を訂正することといたしました。\n\nこれらの決算訂正により、当社が2020年６月26日に提出いたしました第38期（自2019年４月１日至2020年３\n\n月31日）有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規\n\n定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、EY新日本有限責任監査法人により監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "28"}, {"filed": "2019-09-30", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の海外連結子会社であるタイホウコーポレーションオブアメリカにおいて、平成27年から平成30年\n\nまでの期末棚卸資産の不適切な会計処理により、実態と相違がある資産計上が行われている恐れがあることが判明した\n\nことから、当社とは利害関係を有しない外部の弁護士が委員長を務め、その他の社外の専門家を含む委員で構成される\n\n特別調査委員会を令和元年８月２日付で設置し、調査を実施いたしました。令和元年９月26日に同委員会の調査報告書\n\nを受領し、当社は、平成30年３月期以降の売上原価及びたな卸資産並びに減損損失の金額見直し等、必要と認められる\n\n訂正を行うことと致しました。\n\nこれらの決算訂正により、当社が平成30年６月13日に提出いたしました第112期（自平成29年４月１日至平成\n\n30年３月31日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、これを訂正するため、有価\n\n証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、ＰｗＣあらた有限責任監査法人により監査を受けており、そ\n\nの監査報告書を添付しております。\n\n2/115\n\n\n\fEDINET提出書類\n\n大豊工業株式会社(E02199)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "29"}, {"filed": "2023-01-19", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の会計監査人である三優監査法人からの指摘により、連結子会社DaiohsU.S.A.,Inc.（以下、「米国\n\n子会社」という。）において固定資産管理システムと会計システムの間に固定資産残高の不一致が判明し、有形固定資\n\n産の残高、減損評価結果に疑義が生じたことから、その原因究明を行うため社内調査を実施しました。\n\nその結果、固定資産残高の突合作業がこれまで行われていなかったこと、米国子会社では固定資産残高の差異を以前\n\nから把握しながらその重要性の認識を欠いていたため当社および監査人に対する報告が行われてこなかったこと、固定\n\n資産管理システムの仕様上過去のデータを参照できないにも関わらずバックアップが保存されていないこと、固定資産\n\nの中で大きな割合を占めるコーヒーブリューワーや浄水サーバー等の資産について、顧客先に貸し出している資産の適\n\n切な台数管理が一部拠点において行われていなかったこと、などの事象が判明しました。\n\n加えて、米国子会社のレンタル収入が月ずれ前倒しで計上されていたことが、2022年３月期第３四半期に判明し、四\n\n半期報告書においては会計方針の開示、会計上の変更及び誤謬の訂正に関する会計基準に基づいて重要性を判断し、\n\n2022年３月期第３四半期に四半期報告書の修正を行い、現在は適切に処理をしておりますが、今回の訂正報告書提出に\n\nあたり、過年度についても遡及修正の必要があることを認識しました。\n\nまた、訂正に際しては、前述の有形固定資産及びレンタル収入に関する訂正とは別に過年度において重要性がないた\n\nめ遡及修正をしていなかった事項に関する修正も併せて行うことといたしました。\n\nこれらの決算訂正により、2022年８月31日に提出いたしました第54期（自2021年４月１日至2022年３月31日）\n\n有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表については、三優監査法人の監査を受けており、その監査報告書を添付しております。\n\n２", "in_window": true, "ref": "30"}, {"filed": "2024-10-15", "siblings": 2, "sibling_index": 2, "text": "2024年９月30日に提出いたしました第75期（自2023年４月１日至2024年３月31日）有価証券報告書におきま\n\nして、金融商品取引法第24条第６項及び企業内容等の開示に関する内閣府令第17条第１項により添付することとされ\n\nている書類のうち、「第75期定時株主総会継続会開催ご通知」「第75期定時株主総会継続会その他の電子提供措置\n\n事項」が添付されておりませんでしたので、有価証券報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "31"}, {"filed": "2022-03-22", "siblings": 1, "sibling_index": 1, "text": "当社は、取引先の１社より支払い漏れがあるのではないかとの確認を受け、社内調査を行った結果、2016年以降の売\n\n上原価の一部に計上漏れがあることが判明し、2016年以降の決算の訂正を行う可能性がでてきました。そのため、公認\n\n会計士及び弁護士含む社内調査委員会を設置し、調査を行ってまいりましたが、2022年３月22日に社内調査委員会から\n\n調査報告書を受領し、2016年以降の売上原価の一部に計上漏れの誤謬があったことの報告を受けました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四半\n\n期連結財務諸表等で対象となる部分について、訂正することといたしました。\n\nこれらの決算訂正により、当社が2017年６月23日に提出いたしました第33期（自2016年４月１日至2017年３月\n\n31日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、アスカ監査法人の監査を受けており、その監査報告書を添付\n\nしております。\n\n２", "in_window": true, "ref": "32"}, {"filed": "2019-01-16", "siblings": 2, "sibling_index": 1, "text": "2018年11月30日に提出いたしました第25期（自2017年９月１日至2018年８月31日）有価証券報告書に添付し\n\nております「独立監査人の監査報告書及び内部統制監査報告書」及び「独立監査人の監査報告書」の記載事項の一部\n\nに原本と異なる記載がありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものでありま\n\nす。\n\n２", "in_window": true, "ref": "33"}, {"filed": "2024-10-04", "siblings": 1, "sibling_index": 1, "text": "当社子会社である東京博善株式会社（以下、「東京博善」という。）は、同社の葬祭収益セグメント（火葬事業以\n\n外の事業）が立ち上げた会員制団体に関し複数の取引先より入会審査手数料を収受した取引（以下、「本取引」とい\n\nう。）について、2024年３月期に一時点の収益として売上高６億４百万円を計上いたしました。\n\n本取引については、2024年３月期における会計監査人である興亜監査法人に対して、2024年３月19日に当社前代表\n\n取締役社長（当時の代表取締役社長。以下、「当社前社長」という。）から、会員制団体に入会することで得られる\n\n便益について説明を行い、入会審査手数料の価値が、審査という単一の履行義務を充足することで十分に裏付けられ\n\nることを説明した上で、取引先の合意があり、かつ、取引の実態や期末までの入金又は期末日後数日以内に確実に入\n\n金が見込まれること等を理由として、期末日までに審査を実施することで売上高として一括計上をすることの合理性\n\nを説明いたしました。\n\n東京博善は、本取引に係る契約（以下、「入会審査契約」という。）を2024年３月28日・29日に複数の取引先と締\n\n結しました。一方で、入会審査契約の取引先全てとの間で５年間にわたり通常に比して相当有利な条件で役務提供す\n\nる旨の契約（以下、「役務提供契約」という。）を2024年３月28日に合意いたしました。\n\nこの時点で当社は、役務提供契約については入会審査手数料とは独立した契約であると認識していたため、当該契\n\n約の存在を興亜監査法人に対しては明示しておりませんでしたが、2024年３月期の決算監査の過程において、取引先\n\nのうち１社との役務提供契約の存在が興亜監査法人の知るところとなりました。興亜監査法人からは、入会審査契約\n\nと役務提供契約が『収益認識に関する会計基準』における契約の結合に該当し、本来は役務提供期間で収益を認識す\n\nべきであり、当該取引先１社から受領した入会審査手数料全額を一時点ではなく、５年間にわたり収益を認識する必\n\n要がある旨の指摘を受けました。さらに、他の入会審査手数料を受領した取引先と類似の役務提供契約を締結してい\n\nた場合は、契約の結合が必要であり、入会審査手数料として計上した売上高は全て取り消す修正が必要であるとの指\n\n摘（以下、「本件指摘」という。）を受けました。\n\nこれらの指摘に対して当社は、2024年５月14日に興亜監査法人に対して、東京博善が役務提供契約を同時に締結し\n\nた取引先は１社のみであり、他に類似の役務提供契約（以下、「本契約」という。）を締結した取引先はない旨を説\n\n明し、また、その後、今後提供する予定もない旨を経営者確認書で表明した上で、当該取引先１社に係る売上高を修\n\n正せず未修正事項といたしました。当社は未修正事項が連結財務諸表全体へ与える影響に鑑み、連結財務諸表の数値\n\nを修正せず、2024年６月27日に興亜監査法人より金融商品取引法に基づく有価証券報告書に対する監査意見（無限定\n\n適正意見）を受領した上で、有価証券報告書を関東財務局に提出いたしました。なお、興亜監査法人からは、重要な\n\n会計処理には十分に議論が必要であり、当社の業容拡大に伴い、監査時間が増大し、監査法人の人的リソースの関係\n\nから次年度以降の監査時間を十分確保できないリスクが生じるため、2024年６月27日をもって当社の会計監査人を辞\n\n任する旨の申出を受け、当社は後任の一時会計監査人として監査法人アヴァンティアを選任いたしました。\n\n前川代表取締役社長による新経営体制の下で、2024年３月期における重要な取引について正確な理解をするべく取\n\n引内容の検討を行う過程において、本件指摘を受けていた他の取引先（興亜監査法人に対しては存在がないと説明し\n\nていた取引先）についても2024年５月31日付で本契約に係る契約書が締結されていたことが明らかになり、監査法人\n\nアヴァンティアにこれを開示しました。\n\n本契約に係る契約書は、2024年３月29日時点で存在していましたが、契約日付は役務提供の開始日が2024年６月１\n\n日であったため先日付である2024年５月31日とし、2024年６月１日から東京博善より役務提供を行っていました。本\n\n契約の存在は、監査法人アヴァンティアより2024年３月期における「事後判明事実」（監査報告書日後に監査人が知\n\nるところとなったが、もし監査報告書日現在に気づいていたとしたら、監査報告書を修正する原因となった可能性の\n\nある事実）に該当するとの指摘を受け、当社と監査法人アヴァンティア及び前任監査人である興亜監査法人とも協議\n\nを行った結果、2024年９月５日、2024年３月期の有価証券報告書に係る訂正報告書を提出する必要があるとの結論に\n\n至りました。\n\nそれに先立ち当社は、本取引については当社前社長が積極的に推進していたことを踏まえ、両監査法人と協議をし\n\nた上で、当社の顧問弁護士及び弁護士、公認会計士の資格を有する当社の社外監査役２名を委員とする社内調査委員\n\n会を設置し、事後判明事実が起こった原因並びに当社前社長及び経営幹部の関与について、事実と経緯の調査を進め\n\nてまいりました。\n\n当社は社内調査委員会より2024年８月27日に調査報告書を受領し、当社前社長が興亜監査法人より契約の結合が必\n\n要であるとの指摘を受けた時点で、契約日付が到来していない役務提供契約については締結しないように指示してお\n\nり、社内調査委員会から照会されるまで本契約の存在は認識しておらず、意図的に本契約の存在を隠した事実は認定\n\n2/119\n\n\fEDINET提出書類\n\n株式会社広済堂ホールディングス(E00724)\n\n訂正有価証券報告書\n\nされなかったとの報告を受けました。\n\nまた、当社は、上記結論を踏まえ、2024年３月期の有価証券報告書の訂正報告書に係る会計監査（以下、「訂正監\n\n査」という。）を前任監査人である興亜監査法人に委嘱いたしました。訂正監査を実施した結果、2024年３月期に計\n\n上された本取引に係る入会審査手数料全額（６億４百万円）を売上高から全額取り消すとともに、複数の重要でない\n\n誤謬を修正いたしました。当社はこれらの修正が過年度における連結財務諸表等に与える影響は重要でないと判断\n\nし、過年度の決算の訂正は行わず、2024年３月期の連結財務諸表及びその注記に反映することといたしました。\n\n２", "in_window": true, "ref": "34"}, {"filed": "2024-09-30", "siblings": 1, "sibling_index": 1, "text": "当社の連結子会社であるファインシンターインドネシア株式会社において、2024年５月上旬に、棚卸資産の不適切\n\nな会計処理が行われている疑いがあることが判明いたしました。これに伴い当社は、本件の事実関係及びその内容に\n\nついて、調査とその根本原因を究明し、再発防止を図るため、外部専門家による調査が必要であると判断し、2024年\n\n５月23日に特別調査委員会を設置し、調査を進めてまいりました。\n\n2024年９月28日に同委員会より調査報告書を受領し、インドネシア連結子会社における2020年３月期から2024年３\n\n月期までの棚卸資産の過大計上による不適切な会計処理が判明いたしました。また、当該調査の過程において、当社\n\nの山科工場で製造されていた部品の一部について、販売予定がなくなったにもかかわらず、廃却処分を先送りしてい\n\nた事実が新たに判明し、2022年３月期から2024年３月期までの棚卸資産の過大計上による不適切な会計処理が判明い\n\nたしました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四\n\n半期連結財務諸表で対象となる部分について訂正、及びその他、必要と認められる訂正を行いました。\n\nこれらの決算訂正により、当社が2022年６月24日付で提出いたしました第73期(自2021年４月１日至2022年３\n\n月31日)有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定\n\nに基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、PwCJapan有限責任監査法人により監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "35"}, {"filed": "2020-06-29", "siblings": 1, "sibling_index": 1, "text": "2020年６月22日に提出いたしました第44期（自2019年４月１日至2020年３月31日）有価証券報告書について、\n\n金融商品取引法第24条第６項及び企業内容等の開示に関する内閣府令第17条第１項により添付することとされている書\n\n類の添付漏れがありましたので、これを添付するために有価証券報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "36"}, {"filed": "2023-06-13", "siblings": 1, "sibling_index": 1, "text": "2022年12月下旬に会計監査人の通報窓口に、当社前代表取締役社長の星﨑尚彦氏（以下、「星﨑氏」といいま\n\nす。）による当社企業価値を毀損する行為の疑いに関する情報提供を得たことを受け、監査等委員会による調査を行\n\nうとともに、2023年３月７日付にて第三者委員会を設置し調査を進めてまいりました。同５月31日付にて第三者委員\n\n会より調査報告書を受領するに至り、その内容及び指摘事項について精査を進めておりましたところ、2022年７月29\n\n日に提出いたしました第５期(自2021年５月１日至2022年４月30日)有価証券報告書の記載事項の一部に訂正すべ\n\nき事項が判明しましたので、これらを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nなお、第三者委員会が調査対象とした会社（星﨑氏の実質的影響力の下に経営されている可能性がある25社)につい\n\nては一部の会社を除き、星﨑氏等により、意思決定機関を支配していることが伺われ、連結子会社として取り扱うこ\n\nとが適切であると推測できるものの、星﨑氏及び第三者委員会が調査対象とした会社の代理人弁護士より、刑事訴追\n\n及び民事訴追の免責、開示資料の使用方法の制限や資料開示方法の限定（原本の閲覧のみ、複製不可）などの条件を\n\n付され、当社としてはこれら条件を到底受け入れることは出来ず、結果、会計情報等の提供を受けられていないこと\n\nから、当社の連結範囲の適切性等及び当社の財務報告に対する影響の有無を確定できていない旨が第三者委員会の調\n\n査報告書において報告されています。当該報告に基づき、第三者委員会が調査対象とした会社については、当期にか\n\nかる連結財務諸表の連結の範囲に含めるべきかを判断する情報及び根拠等が入手できていないことから、子会社又は\n\n関連会社の範囲に含める訂正を行っていません。また、関連当事者の範囲に該当するか判断する情報及び根拠等も入\n\n手できていないことから、関連当事者の範囲に含めておらず、追加の訂正も行っておりません。さらに、第三者委員\n\n会が調査対象とした会社のうち一部の会社と当社の取引において、賃料増額の不合理性及び定期処理業務料の金額の\n\n不透明性を指摘することができると思われる旨、並びに根拠が不明確な請求倍率で請求されている可能性や業務実態\n\nが確認できない費用を請求されている可能性がある及び実態にそぐわない請求をされている業務委託費が存在する旨\n\nが第三者委員会の調査報告書において報告されています。しかしながら、当該取引が当連結会計年度及びそれ以前の\n\n会計期間（会計期間を特定できない）にかかる虚偽表示に該当するかどうかを判断、及び影響が及んでいる対象とな\n\nる会計期間の特定に必要な情報や根拠等が入手できなかったため、当連結会計年度において販売費及び一般管理費に\n\n含まれる業務委託費並びにその他流動負債に含まれる関連する未払金に係る修正を行っておりません。\n\nしたがって、以上の影響の有無やその金額が確定できる状況になく、当期にかかる連結財務諸表項目及び金額並び\n\nに注記を訂正すべきか、また、訂正される場合における連結財務諸表項目及び金額並びに注記の影響の程度が判明し\n\nていないことから、関連する連結財務諸表項目及び金額並びに注記に重要な虚偽記載が存在する可能性があります。\n\n２", "in_window": true, "ref": "37"}, {"filed": "2017-07-10", "siblings": 1, "sibling_index": 1, "text": "平成29年６月29日に提出いたしました第105期（自平成28年４月１日至平成29年３月31日）の有価証券報告書\n\nの記載の一部に訂正すべき事項がありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するもので\n\nEDINET提出書類\n\n株式会社ヤギ(E02825)\n\n訂正有価証券報告書\n\nあります。\n\n２", "in_window": true, "ref": "38"}, {"filed": "2023-07-26", "siblings": 2, "sibling_index": 2, "text": "2023年７月20日に提出いたしました第70期（自2020年３月21日至2021年３月20日）有価証券報告書の訂正報\n\n告書に本来必要でない独立監査人の監査報告書を表示しており、これを削除するため、また、添付しております「独\n\n立監査法人の監査報告書」の記載事項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報\n\nEDINET提出書類\n\n株式会社プロルート丸光(E02695)\n\n訂正有価証券報告書\n\n告書を提出するものであります。\n\n２", "in_window": true, "ref": "39"}, {"filed": "2018-08-15", "siblings": 1, "sibling_index": 1, "text": "当社における不動産事業等及び当社連結子会社である株式会社kiddingにおける不動産フランチャイズ権利販売にお\n\nいて、会計上疑義のある取引が存在することが判明いたしました。当社といたしましては、本件に関し、専門的かつ客\n\n観的な見地からの調査が必要と判断し、平成30年７月10日に取締役会を開催し、当社と利害関係を有しない外部の専門\n\n家から構成される第三者委員会を設置し、当該取引の事実関係の調査等を行いました。\n\n平成30年８月10日付で同委員会による調査報告書を受領いたしました。その結果、当社及び連結子会社である株式会\n\n社kiddingの取引において、従来、事業取引として計上していた取引の一部に弊社取締役の私財を投じた取引が確認さ\n\nれ、当該取引は実在するものの、計上は資金取引等として取り扱うべきである旨、指摘されました。\n\n当社は、過去に提出した有価証券報告書に記載されている連結財務諸表及び財務諸表に含まれる当該取引に係る会計\n\n処理を訂正することを平成30年８月15日開催の取締役会の承認を経て決定し、当該有価証券報告書について訂正を行う\n\nことといたしました。\n\nこれらの決算訂正により、当社が平成30年２月27日に提出いたしました第14期（自平成28年12月１日至平成\n\n29年11月30日）に係る有価証券報告書の一部を訂正する必要が生じましたので、有価証券報告書の訂正報告書を提出す\n\nるものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、ひので監査法人により監査を受けており、その監査報告書を\n\n添付しております。\n２", "in_window": true, "ref": "40"}, {"filed": "2020-07-03", "siblings": 1, "sibling_index": 1, "text": "2020年６月25日に提出した第167期（自2019年４月１日至2020年３月31日）有価証券報告書の記載事項の一部\n\nに誤りがあったため、これを訂正するため有価証券報告書の訂正報告書を提出する。\n\nEDINET提出書類\n\n株式会社朝日新聞社(E00718)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "41"}, {"filed": "2025-03-26", "siblings": 1, "sibling_index": 1, "text": "2024年３月29日に提出いたしました第３期（自2023年１月１日至2023年12月31日）有価証券報告書の記載事項\n\nの一部に訂正すべき事項がありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものでありま\n\nフルサト・マルカホールディングス株式会社(E36707)\n\n訂正有価証券報告書\n\nEDINET提出書類\n\nす。\n\n２", "in_window": true, "ref": "42"}, {"filed": "2019-03-29", "siblings": 2, "sibling_index": 1, "text": "2017年６月29日に提出いたしました第71期（自2016年４月１日至2017年３月31日）有価証券報告書の記載の一\n\n部に訂正すべき事項がありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n住友精密工業株式会社(E02255)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "43"}, {"filed": "2024-08-20", "siblings": 2, "sibling_index": 2, "text": "2024年８月14日に提出いたしました第18期（自2021年１月１日至2021年12月31日）有価証券報告書の訂正報\n\n告書の記載事項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するもので\n\nEDINET提出書類\n\n株式会社ｋｕｂｅｌｌ(E35124)\n\n訂正有価証券報告書\n\nあります。\n\n２", "in_window": true, "ref": "44"}, {"filed": "2023-03-30", "siblings": 1, "sibling_index": 1, "text": "2023年３月30日に提出いたしました第61期（自2022年１月１日至2022年12月31日）有価証券報告書につい\n\nて、金融商品取引法第24条第６項および企業内容等の開示に関する内閣府令第17条第１項により添付することとされ\n\nている書類の添付漏れがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものでありま\n\nす。\n\n２", "in_window": true, "ref": "45"}, {"filed": "2024-01-31", "siblings": 2, "sibling_index": 1, "text": "当社グループは、当社の元代表取締役である島岡潤氏及び元取締役山川太郎氏が、当社子会社における新規事業\n\n参入にあたって第三者に不正に金品を供与したと疑われる行為及びこれに関連する不正な行為を行った疑いがある\n\nこと（以下「本件疑惑」といいます。）から、当社グループは、事実関係の正確な把握のために、外部専門家から\n\n構成される第三者委員会を設置いたしました。その後、再生バッテリーを事業用ポータルバッテリーとしてリユー\n\nスレンタルする環境配慮型の事業に関する取引について、当社の取引先から、取引先の税務調査において当該取引\n\nの目的物の実在性に関する重大な問題（以下「本件追加疑惑」といいます。）があった旨の通知文書を受領し、そ\n\nの類似事案（以下「本件追加疑惑等」といいます。）に係る疑いもあり、第三者委員会には本件疑惑に加え、本件\n\n追加疑惑及び本件追加疑惑等の調査も委嘱し、事実関係の調査等を進めてまいりました。\n\n当社グループは、2024年１月15日に第三者委員会から調査報告書を受領した結果、当社の元代表取締役が在任中\n\nに不適切な金銭授受及び利益相反取引規制を潜脱するような行為や、当社の再生バッテリーを事業用ポータルバッ\n\nテリーとしてリユースレンタルする環境配慮型の事業に関する取引において、売上の計上に関する不適切な会計処\n\n理等の事実等が判明いたしました。\n\nこのため、当社は過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四\n\n半期連結財務諸表等で対象となる部分について、訂正することといたしました。\n\nこれらの決算訂正により、当社が2022年12月28日に提出いたしました第39期（自2021年10月１日至2022年\n\n９月30日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２\n\n第1項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、フロンティア監査法人により監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "46"}, {"filed": "2019-09-02", "siblings": 2, "sibling_index": 2, "text": "当社は、過去の企業結合等の会計処理の一部に誤謬があることが判明し、建物及び構築物、土地、減価償却費など\n\nの金額の見直しを行うため、必要と認められる訂正を行うことといたしました。これらの決算訂正により、当社が平\n\n成31年３月29日に提出いたしました第43期（自平成30年１月１日至平成30年12月31日）に係る有価証券報告書\n\nの一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正\n\n報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表については、ＲＳＭ清和監査法人により監査を受けており、その監査報告書を添付し\n\nております。\n\n２", "in_window": true, "ref": "47"}, {"filed": "2023-04-20", "siblings": 1, "sibling_index": 1, "text": "2022年４月27日付で、第14期（自2021年３月１日至2022年１月31日）の有価証券報告書を提出いたしました\n\nが、当該有価証券報告書につき、オペレーティング・リース取引にかかる記載および数値の社内確認作業に誤りがあっ\n\nたため、これらを訂正するために有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社ＴＯＫＹＯＢＡＳＥ(E31742)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "48"}, {"filed": "2019-09-13", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の中国プロジェクトに係る貸付金等債権に関する過年度の貸倒引当金の計上に疑義があるという外部\n\nからの指摘を受け、調査の必要性があると判断されたため、令和元年７月10日、当社と利害関係を有しない外部の専\n\n門家から構成される特別調査委員会を設置し、専門的かつ客観的な調査を進めて参りました。\n\n令和元年９月６日に特別調査委員会から調査報告書を受領し、当該中国プロジェクトに係る貸付金債権については\n\n平成22年７月期の第２四半期に、出資持分の売買代金債権については平成22年７月期の第３四半期に、それぞれ債務\n\n者の支払い能力を踏まえた貸倒引当金の計上を行う必要があったとの報告を受けました。当社は、報告内容の検討の\n\n結果、当該債権に対する貸倒引当金の計上時期の見直しを行い、平成26年７月期から平成30年７月期の有価証券報告\n\n書、並びに平成26年７月期の第１四半期から令和元年７月期の第３半期までの四半期報告書についての決算訂正を行\n\nうことといたしました。\n\nこれらの決算訂正により、当社が平成28年10月28日に提出いたしました第48期(自平成27年８月１日至平成28\n\n年７月31日)に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第\n\n１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、アーク有限責任監査法人より監査を受けており、その監査\n\n報告書を添付しております。\n\n２", "in_window": true, "ref": "49"}, {"filed": "2023-04-11", "siblings": 3, "sibling_index": 3, "text": "2021年３月29日に提出いたしました第14期（自2020年１月１日至2020年12月31日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\n２", "in_window": true, "ref": "50"}, {"filed": "2024-10-01", "siblings": 2, "sibling_index": 1, "text": "2024年９月30日に提出いたしました第75期(自2023年４月１日至2024年３月31日)有価証券報告書に添付して\n\nおります「独立監査人の監査報告書」の記載事項の一部に原本と異なる記載がありましたので、これを訂正するため\n\n有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社ファインシンター(E01396)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "51"}, {"filed": "2019-12-13", "siblings": 1, "sibling_index": 1, "text": "2018年12月25日に提出いたしました第20期（自2017年10月１日至2018年９月30日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社エスユーエス(E33357)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "52"}, {"filed": "2021-06-30", "siblings": 1, "sibling_index": 1, "text": "当社は、連結子会社２社である株式会社トレードセブン、及びその子会社である株式会社TSProjectにおいて実行\n\nしておりました蓄電池事業におきましてその取引実態に疑義があることが判明し、弁護士及び会計士等で構成する特\n\n別調査委員会の調査結論を経て、不適切な会計処理が行われていた事実を確認いたしました。\n\nこれに伴い当社は、2017年11月から2019年4月（2017年12月期から2019年6月期）にかけて行われた計18回の取引につ\n\nきまして、当該売上・仕入及び売掛金の計上を取り消し、回収時に差益を特別利益として認識することといたしまし\n\nた。\n\nまたこの取引に関わる不透明な資金支出に関しまして、2018年3月期に一括して特別損失として処理を行い、一連の\n\n会計処理を訂正することといたしました。この処理に伴い、株式会社トレードセブンの純資産に影響が発生したた\n\nめ、当社保有の同社株式の減損処理等も同時に実施いたしました。\n\nこの他監査法人の変更に伴い、過去の経理処理を全面的に精査した結果、海外子会社での見積もりの訂正が必要と\n\n判断いたしました。マレーシア子会社1社につき収益状況が悪化し今後の見通し等も勘案した結果、2020.3期に固定資\n\n産、貸付金等の減損引き当て処理を実施いたしました。\n\nこれらの決算訂正により、2019年６月26日に提出いたしました第99期（自2018年４月１日至2019年３月31\n\n日）有価証券報告書の記載事項の一部に訂正する必要が生じましたので、これを訂正するため、有価証券報告書の\n\n訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表については、監査法人アリアにより監査を受けており、その監査報告書を添付しており\n\nます。\n\n２", "in_window": true, "ref": "53"}, {"filed": "2024-11-05", "siblings": 2, "sibling_index": 1, "text": "2023年８月29日に提出いたしました第34期（自2022年６月１日至2023年５月31日）有価証券報告書の記載事項\n\nの一部に訂正すべき事項がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出するものであり\n\nＳｈｉｎｗａＷｉｓｅＨｏｌｄｉｎｇｓ株式会社(E05450)\n\n訂正有価証券報告書\n\nEDINET提出書類\n\nます。\n\n２", "in_window": true, "ref": "54"}, {"filed": "2025-01-31", "siblings": 2, "sibling_index": 2, "text": "当社グループは、鹿児島県霧島市に所在する建物付き土地案件（以下「当該案件」といいます。）に関して、外部\n\n機関より、2020年９月時点における会計処理の一部に疑義があるとの指摘を受けました。当該案件は継続取引ではな\n\nいため、影響が限定的であることから、第一義的には社内での調査が適当であると考え、社内での自主点検を実施い\n\nたしました。\n\n自主点検の目的は、当該案件の期末評価に関し、事実関係及びその他不適切な会計処理の確認を行うこと、及び、\n\n当該案件の類似案件として、期末において個別評価が必要と判断される資産項目等に関し、妥当性及び適正性の確認\n\nを行うこととしております。点検方法としては、関連資産精査、社内外の関係者へのヒアリング、デジタルフォレン\n\nジック等を実施いたしました。\n\n自主点検による結果を受けて、当社グループは過去に提出済みの有価証券報告書等に記載されております財務諸表\n\n等で対象となる部分について、訂正することといたしました。\n\nこれらの決算訂正により、当社が2022年12月28日に提出し、2024年１月31日に訂正報告書を提出いたしました第39\n\n期(自2021年10月１日至2022年９月30日)有価証券報告書の記載事項の一部を訂正する必要が生じましたので、\n\n金融商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、フロンティア監査法人により監査を受けており、その監査\n\n報告書を添付しております。\n\n２", "in_window": true, "ref": "55"}, {"filed": "2021-10-06", "siblings": 1, "sibling_index": 1, "text": "当社は、棚卸資産の残高確定の過程において過去の会計処理に誤りがある可能性が判明したため、2021年５月20\n\n日、社内調査委員会を設置し、調査を進めておりましたが、調査の過程において、当社役員による不適切な業務執行\n\nの可能性を含む内部統制上の問題が存在する疑義が生じました。そのため当社は、より客観性・独立性を高めた調査\n\nを行うため、2021年６月24日、外部の弁護士・公認会計士を含む特別調査委員会に移行した上で、調査を進めてまい\n\nりました。\n\n2021年９月17日に特別調査委員会から調査報告書を受領し、仕掛品計上された材料費や加工費等の一部が過去より\n\n適切に製品勘定に振り替えられず、適時適切に費用処理されてこなかった結果、棚卸資産（仕掛品）残高が過大に計\n\n上されていたとの報告を受けました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四\n\n半期連結財務諸表等で対象となる部分について、訂正することといたしました。\n\nなお、訂正に際しては、過年度において重要性がないため訂正を行っていなかった事項の訂正も併せて行っており\n\nます。\n\nこれらの決算訂正により、当社が平成29年６月29日に提出いたしました第159期（自平成28年４月１日至平成\n\n29年３月31日）有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に\n\n基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、EY新日本有限責任監査法人の監査を受けており、その監査\n\n報告書を添付しております。\n\n２", "in_window": true, "ref": "56"}, {"filed": "2019-05-14", "siblings": 1, "sibling_index": 1, "text": "第１経緯\n\n当社は、(a)当社元代表取締役兼会長であるカルロス・ゴーン氏（以下「ゴーン氏」といいます。）、元代表取締役\n\nグレッグ・ケリー氏（以下「ケリー氏」といいます。）及び両名に協力していた可能性がある者による重大な不正行\n\n為、並びに、(b)その他当社の役員報酬等の開示の正確性に影響し得る事実関係（以下「本事案」と総称します。）の発\n\n覚を受け、徹底的かつ幅広い対応を行ってまいりました。かかる対応とこれに伴う調査は網羅的なものであり、当社の\n\nグローバルリスク＆コンプライアンス室において把握できた重要なコンプライアンスに関する事項の全てを調査してま\n\nいりました。当社は、かかる調査における結果に基づき、(a)平成31年３月期における本事案に関連する当社の財務情報\n\nの一括修正（以下「本一括修正」といいます。）、及び(b)役員報酬等の開示に関する平成18年３月期乃至平成30年３月\n\n期の各年の過年度訂正（以下「本報酬開示訂正」といいます。）の内容を準備しました。これらについて社外の会計・\n\n法務の専門家を委員に含む財務報告に関する社内評価委員会の検討手続きを踏んだ後、当社の取締役会において、上記\n\nの調査の結果を考慮した上で、令和元年５月14日、平成18年３月期から平成30年３月期までの各事業年度の有価証券報\n\n告書に係る訂正内容を、承認しました。同日、当社は、(a)本一括修正を反映した平成31年３月期の通期決算短信を公表\n\nし、(b)本報酬開示訂正に係る訂正報告書を関東財務局に提出しました。平成26年３月期から平成30年３月期に係る訂正\n\n内容については、金融庁の電子開示システムのEDINET（http://disclosure.edinet-fsa.go.jp/）及び当社のウェブサイ\n\nト（https://www.nissan-global.com/JP/IR/LIBRARY/FR/）において、有価証券報告書の公衆縦覧期間に含まれない平成\n\n18年３月期から平成25年３月期に係る訂正内容については当社のウェブサイト（https://www.nissan-\n\nglobal.com/JP/IR/LIBRARY/FR/）において、それぞれご覧いただくことができます。本訂正報告書は、平成29年６月29\n\n日に提出いたしました第118期(自平成28年４月１日至平成29年３月31日)有価証券報告書の訂正報告書となりま\n\nす。\n\n第２概要\n\n役員報酬の総額開示及び個別開示に関する規制が適用される平成22年３月期以降の役員の報酬等の訂正内容は、当社\n\nの以下の開示方針（「報酬開示方針」）に基づき、作成しています。\n\n(1)各種類の報酬等に共通する事項：「役員」の「報酬等」の定義\n\n①報酬の総額開示の対象となるのは、当社の「役員」としての「報酬等」（「単体報酬等」）である。\n\n②報酬の個別開示の対象となるのは、当社の「役員」に、当社の連結子会社の「役員」としての「報酬等」があ\n\nる場合であって、その「報酬等」と単体報酬等との合算（「連結報酬等」）が1億円以上になる者について、連\n\n結報酬等である。ただし、連結子会社から受ける「役員」としての「報酬等」につき、投資情報としての重要\n\n性に乏しい場合は、その部分については、1億円基準への合算及び個別開示を要しない。\n\n③「役員」とは、取締役、監査役又は執行役（連結子会社が外国法人の場合、これらの役職と同等の権限を有す\n\nる者）をいい、作成対象の有価証券報告書に係る事業年度の末日よりも前の日（当該事業年度内の日に限られ\n\nない。）に、これらの役職を退任していた者を含む。\n\n④「役員の報酬等」とは、役員としての報酬、賞与その他その職務執行の対価としてその会社から受ける財産上\n\nの利益をいう。\n\n⑤開示は、以下の有価証券報告書において行う。ただし、過去のいずれかの事業年度に係る有価証券報告書にお\n\nいて既に開示していた報酬等については、改めて開示することは要しない。\n\n(a)役員の報酬等が、特定の事業年度に係るものであって、当該事業年度における有価証券報告書作成時\n\n点においてその額が明らかとなっていれば、当該事業年度における有価証券報告書\n\n(b)上記（a）以外の場合は、対象となる報酬等を受け、又は受ける見込みの額が明らかとなった事業年度\n\nにおける有価証券報告書\n\n(2)各種類の報酬等に共通する事項：「役員」の「報酬等」の該当性に関するあてはめ\n\n①ゴーン氏については、過年度において、①当社の非連結子会社を使った、リオデジャネイロ及びベイルートで\n\nの同氏の住宅の購入・改装、②当社から同氏の姉に対する長期にわたる顧問料名目での金銭の支払い、③当社\n\nのコーポレートジェット及びチャータージェットの自己及び家族の私的用途での使用等、会社資産及び経費の\n\n私的流用が判明している。これらは、役員としての職務執行の対価に当たらないと解されるため、対応する事\n\n業年度の有価証券報告書における「役員の報酬等」欄記載の同氏の報酬等の額に含めていない。\n\n②当社の役員を退任した後にその者が受けた財産上の利益について、それが、役員退任後に執行した職務の対価\n\n2/7\n\n\n\fEDINET提出書類\n\n日産自動車株式会社(E02142)\n\n訂正有価証券報告書\n\nや（例：正当な顧問料）、役員退任後に履行した義務の対価（例：正当な競業避止義務に対する補償金）であ\n\nれば、「当社の役員としての職務執行の対価」には当たらないと解されるため、報酬等の額に含めていない。\n\n当社の役員を退任した後に受ける見込みの財産上の利益、又は役員を退任した後に受けた財産上の利益につい\n\nて、その実態が「当社の役員としての職務執行の対価」の後払いであると評価される場合は、報酬開示を行\n\nう。[報酬開示方針（1）③及び④]\n\n③当社の役員に就任する前にその者が受けた財産上の利益について、それが、当該役員就任前に執行した職務の\n\n対価であれば、「当社の役員としての職務執行の対価」には当たらないと解されるため、報酬等の額に含めて\n\nいない。当社の役員に就任する前に受けた財産上の利益について、その実態が「当社の役員としての職務執行\n\nの対価」の前払いであると評価される場合は、報酬開示を行う。[報酬開示方針（1）④]\n\n④当社の役員が、当社の子会社、関係会社その他の法人から受け取る財産上の利益について、「当社の役員とし\n\nての職務執行の対価」に該当するか否かを個々に判定し、これに該当すると評価される場合は、当社の役員と\n\nしての報酬等として開示する。[報酬開示方針（1）④]\n\n⑤当社の役員としての報酬等に、当社から直接支払われた額と、直接には当社の子会社、関係会社その他の法人\n\nから支払われた額が含まれる場合、当社の役員としての報酬等の額として合算値を開示したうえで、直接支\n\n払った法人ごとの額の内訳を、「役員の報酬等」の開示欄に注記する。[報酬開示方針（2）④]\n\n⑥役員が受ける財産上の利益が複数の要素から構成されている等が原因で、「役員としての報酬等」に該当する\n\n額を一義的に特定できない場合がある。こういった場合は、保守的に大きい方の額を開示し、当該開示額の根\n\n拠を注記する。\n\n⑦本項の各方針は、当社の連結子会社の役員としての報酬等の開示にも適用される。この場合、「当社」は、\n\n「当社の連結子会社」に読み替える。\n\n(3)株価連動型インセンティブ受領権に関する事項\n\n①当社の株価連動型インセンティブ受領権は、業績評価期間後、速やかに行使可能数が確定する設計となってい\n\nる。付与者が、(a)株価連動型インセンティブ受領権の付与を受けた時点、又は(b)業績評価期間の一部又は全\n\nてにおいて、役員であれば、かかる株価連動型インセンティブ受領権は、「役員の報酬等」と扱う（このよう\n\nに扱われる株価連動型インセンティブ受領権を、「役員株価連動型インセンティブ受領権」という。）。役員\n\n株価連動型インセンティブ受領権の行使可能数が確定した後、最初に提出される有価証券報告書において、当\n\n該有価証券報告書が対象とする事業年度の末日時点の株価等のパラメーターを用いて算定した公正価額を、役\n\n員が「受ける」報酬等の「見込みの額」として開示する。[報酬開示方針（1）⑤の(b)]\n\n②有価証券報告書の対象となる事業年度に、付与者が、役員株価連動型インセンティブ受領権（すなわち、付与\n\n者が、(a)株価連動型インセンティブ受領権の付与を受けた時点、又は(b)業績評価期間の一部又は全てにおい\n\nて、役員である場合の、株価連動型インセンティブ受領権）を行使して当社から受けた金銭の額は、役員が\n\n「受けた」報酬等の「額」に該当すると解される。当該金額（実支給額）が、過去の事業年度に係る有価証券\n\n報告書に開示した当時の株価に基づく当該株価連動型インセンティブ受領権の公正価額（見込みの額）と異な\n\nる場合は、対象事業年度において差額を開示する。役員株価連動型インセンティブ受領権に係る公正価値が過\n\n去の事業年度において開示されていない場合には、その行使により当社から受けた金銭の全額を開示する。当\n\n該差額開示は、受取り額が過去に開示した公正価額より高いか低いかを問わず、行う。受取り額が過去に開示\n\nした公正価額より低ければ、差額開示される額は負の値となる。株価連動型インセンティブ受領権を行使した\n\n時点において役員を退任していた場合も、当該株価連動型インセンティブ受領権が役員株価連動型インセン\n\nティブ受領権に該当する限り、差額開示は行う。[報酬開示方針（1）⑤の(b)及びただし書き]\n\n③報酬開示方針（3）①に従って開示されるべき有価証券報告書の提出日より前に、株価連動型インセンティブ受\n\n領権が失効していた場合、当該失効した株価連動型インセンティブ受領権の開示は行わない。\n\n④失効した株価連動型インセンティブ受領権に代えて、当社が、報酬の適正な決定手続きを経て金銭を支払った\n\n場合、かかる支払いは、金銭報酬に該当すると解される。当該支払いを受けた役員については、当該金銭の額\n\nが明らかになった事業年度の有価証券報告書において、当該金銭の額を、当該役員の他の金銭報酬に合算して\n\n開示する。[報酬開示方針（1）⑤の(b)]\n\n⑤特定の役員に付与された株価連動型インセンティブ受領権について、付与がなされた後に、業績目標又は業績\n\n評価期間が変更されたものがある。かかる事後的な変更は無効として扱い、株価連動型インセンティブ受領権\n\n付与時に設定された業績目標及び業績評価期間に基づき、行使可能数の確定を判断する。\n\n3/7\n\n\fEDINET提出書類\n\n日産自動車株式会社(E02142)\n\n訂正有価証券報告書\n\n⑥株価連動型インセンティブ受領権の公正価額を算定するパラメーターの一つに、権利行使期間がある。特定の\n\n役員に付与された株価連動型インセンティブ受領権について、付与がなされた後に、権利行使期間の開始日を\n\n遅らせた（その結果、権利行使期間が短くなった）ものがある。かかる事後的な変更は、当該役員の同意が\n\nあった場合は有効として扱う。原則として、変更後の権利行使期間に基づき算出した公正価額を開示するが、\n\n例外として、公正価額を開示すべき有価証券報告書の作成時点においてかかる公正価額が算出されていなかっ\n\nた場合は、変更前の権利行使期間に基づき算出されていた公正価額を開示する。\n\n⑦特定の事業年度において特定の役員に付与された株価連動型インセンティブ受領権について、翌事業年度以降\n\nに付与数が増加されたものがある。事後的な付与数の増加は無効として扱い、変更前の付与数を前提に、行使\n\n可能数の確定を判断する。\n\n⑧無効と扱われる株価連動型インセンティブ受領権の行使相当分として、当社が、報酬の適正な決定手続きを経\n\nて金銭を支払った場合、かかる支払いは、金銭報酬に該当すると解される。当該支払いを受けた役員について\n\nは、当該金銭の額が明らかになった事業年度の有価証券報告書において、当該金銭の額を、当該役員の他の金\n\n銭報酬に合算して開示する。[報酬開示方針（1）⑤の(b)]\n\n⑨株価連動型インセンティブ受領権の発行要領において、株価連動型インセンティブ受領権を発行するには、株\n\n価連動型インセンティブ受領権の付与書面を対象役員に発行する必要がある旨が、規定されている。対象役員\n\nに当該付与書面が発行されなかった場合は、株価連動型インセンティブ受領権の発行行為が存在しないため、\n\n株価連動型インセンティブ受領権の開示額はゼロとする。会計上、株価連動型インセンティブ受領権にかかる\n\n費用が計上されていたとしても、役員報酬の開示額は、同様にゼロとする。\n\n（4）退職慰労金\n\n①当社は、平成19年６月20日開催の株主総会の決議に基づき、退職慰労金制度を廃止し、当該株主総会において\n\n重任された取締役及び監査役の退任時に、取締役会で承認された打切り支給を行っている。平成20年３月期の\n\n有価証券報告書の財務諸表において、役員退職慰労金制度廃止に伴う支給予定額6,533百万円を特別損失に計上\n\nするとともに、未払額を固定負債のその他に含めて計上していることを開示済みである。これに加えて、退任\n\n取締役または退任監査役に支給額が支払われた事業年度の有価証券報告書において、連結報酬等が１億円以上\n\nになる者については氏名及び退職慰労金の支払額を開示し、連結報酬等が１億円未満になる者については対象\n\n者の人数及び退職慰労金の支払額の合計を役員区分ごとに開示する。\n\n②当社の役員が当社の連結子会社から受ける退職金について、その者が、当社の連結子会社において「役員」に\n\n相当する役職になかった場合、形式的には、「当社の連結子会社の役員としての」報酬等に該当しない。しか\n\nし、かかる退職金には、「当社の役員としての」功労に対する評価を含むことがあるため、報酬開示との関係\n\nでは、一律、「報酬等」と扱い、開示する。この退職金の承認・給付手続きは、当社ではなく、連結子会社に\n\nおいて行われるものであることから、報酬開示における会社区分欄は、当社からの報酬等ではなく、当社の連\n\n結子会社からの報酬等として扱い、役員区分欄は「該当なし」と記載する。\n\n２", "in_window": true, "ref": "57"}, {"filed": "2018-07-20", "siblings": 1, "sibling_index": 1, "text": "当社の連結子会社である株式会社釣りビジョンが、約10年にわたり、正常な取引として売上及び費用等を認識・計上\n\nしていた、映像受託制作取引に関して、業務再委託先によって恰も取引が成立していたかのように装われた架空取引が\n\n行われていたことが判明いたしました。当該架空取引被害に対し、当社は社内調査委員会を設置し、調査を進めてまい\n\nりました。更に、調査を進めていく過程で、より慎重に調査範囲の拡大を行う必要があると判断したことから、平成30\n\n年4月20日に当社と利害関係のない外部の専門家（弁護士等）による第三者委員会を設置し、当社内関係者の関与の有\n\n無や当該架空取引に類似する取引等の有無の調査等を委嘱し、平成30年5月23日付で調査報告書を受領いたしました。\n\n当社は上記の社内調査委員会及び第三者委員会の調査報告を踏まえ、当該架空取引被害の影響額についての会計処理\n\nを修正することとし、平成26年3月期から平成29年3月期の有価証券報告書及び平成28年3月期から平成30年3月期までの\n\n四半期報告書の訂正を行うことといたしました。\n\nこれらの決算訂正により、当社が平成29年６月23日に提出いたしました第21期（自平成28年４月１日至平成29\n\n年３月31日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定\n\nに基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、仁智監査法人により監査を受けており、その監査報告書を添\n\n付しております。\n\n２", "in_window": true, "ref": "58"}, {"filed": "2023-07-20", "siblings": 2, "sibling_index": 1, "text": "当社は、2020年３月21日から2022年４月20日分までに申請していた雇用調整助成金について、2022年２月より開始\n\nされた大阪労働局助成金センターによる確認調査の結果、不正受給であったと認定され、2023年３月28日付けで、当\n\n社が受給していた雇用調整助成金全額について支給決定等取消通知が発出されました。\n\nこれを受けて当社は、上記期間中に不正受給として受領していた雇用調整助成金全額（違約金及び延滞金を含む）\n\nを返還することとしました。\n\nこれに伴い、過小計上となっていた給料の修正を行うため、2021年３月期及び2022年３月期の有価証券報告書、\n\n2021年３月期第１四半期から2023年３月期第３四半期までの四半期報告書について決算訂正を行うことといたしまし\n\nた。\n\nこれにより、2021年６月17日に提出いたしました第70期（自2020年３月21日至2021年３月20日）有価証券報\n\n告書の記載事項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するもので\n\nあります。\n\n２", "in_window": true, "ref": "59"}, {"filed": "2023-03-08", "siblings": 3, "sibling_index": 1, "text": "当社は、外部機関より、商事事業の売上の一部について、実質的には、取引の主体となっていない代理人取引や金\n\n融的取引等があるのではないか等の疑義を呈されたことから、客観的な事実関係を明らかにするとともに、当社の管\n\n理体制に問題がなかったか否か等を明確にするために、当社と利害関係の無い外部の有識者で構成される第三者委員\n\n会を2022年12月９日に設置し、調査を進めてまいりました。\n\n2023年３月３日付の第三者委員会の調査の結果、商事事業の売上には資金還流が確認された実質金融取引、資金還\n\n流の兆候や取引商材の実在性の観点から金融取引と疑われる取引、また、それ以外の取引全般についても取引商材の\n\n販売価格ではなく販売価格と仕入価格の純額を手数料収入として会計処理すべき介入取引があり、不適切な会計処理\n\nとなっていることなどの指摘を受けました。このため、当社は、当該不適切な会計処理の決算への影響額を調査し、\n\nこの度、過年度の決算を訂正いたしました。\n\nこれらの決算訂正により、当社が2019年５月30日に提出いたしました第113期（自2018年３月１日至2019年２\n\n月28日）有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、監査法人アリアの監査を受けており、その監査報告書を添\n\n付しております。\n\n２", "in_window": true, "ref": "60"}, {"filed": "2024-09-06", "siblings": 1, "sibling_index": 1, "text": "当社は、石川労働局の調査において、当社及び連結子会社である株式会社ウイル・コーポレーションにて2020年４月\n\nから2023年１月までに受給した雇用調整助成金について、支給申請手続の一部に精査が必要となる疑義が発生したため\n\n社内調査を行った結果、勤怠管理を含む管理体制の不備に起因する助成金申請内容と社内管理記録との間の不整合が判\n\n明したことから、石川労働局に対し雇用調整助成金を自主返還するとともに事実関係の解明のために2024年４月23日に\n\n第三者委員会を組成いたしました。\n\n第三者委員会においては、当事案に係る事実関係の調査、原因究明及び再発防止策の検討を行い、当社は2024年７月\n\n８日に報告書を受領しました。報告書では、常勤の取締役らの関与により雇用調整助成金の不正な受給が行われていた\n\nと結論付けられています。\n\n当社グループは、当時受給した雇用調整助成金について売上原価もしくは販売費及び一般管理費を減額する会計処理\n\nを行っておりましたが、当社は、当該報告書の内容を踏まえ、雇用調整助成金返還額860百万円のうち、違約金及び延\n\n滞金を除く669百万円を過年度の連結財務諸表に遡及して取消すことといたしました。\n\nまた当社は、その判断に伴い、2020年10月期連結会計年度に、情報・印刷事業セグメント及び全社の固定資産に対し\n\nて減損損失の認識の判定を再実施した結果、1,843百万円の減損損失を計上することといたしました。\n\nこれらの訂正により、2024年１月29日に提出いたしました第45期（自2022年11月１日至2023年10月31日）有価\n\n証券報告書の記載事項の一部に訂正する必要が生じましたので、これを訂正するため、有価証券報告書の訂正報告書を\n\n提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、仰星監査法人により監査を受けており、その監査報告書を添\n\n付しております。\n\n２", "in_window": true, "ref": "61"}, {"filed": "2023-11-30", "siblings": 2, "sibling_index": 2, "text": "当社は2017年９月期から2021年９月期の訂正有価証券報告書並びに訂正四半期報告書を2022年３月31日に提出してい\n\nますが、外部からの指摘を踏まえ、当社内で改めて再検討した結果、当社子会社株式会社セントラルパートナーズにお\n\nける収益認識基準を現行基準へ変更することが適切と認識しました。\n\nこれらに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四\n\n半期連結財務諸表等で対象となる部分について、訂正することといたしました。\n\nなお、訂正に際しては、過年度において重要性の観点から訂正を行っていなかった事項の訂正も併せて行っておりま\n\nす。\n\nこれらの決算訂正により、当社が2022年３月31日に提出いたしました第30期（自2019年10月１日至2020年９月\n\n30日）に係る有価証券報告書の記載事項の一部を再訂正する必要が生じましたので、金融商品取引法第24条の２第１項\n\nの規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、再訂正後の連結財務諸表及び財務諸表については、有限責任中部総合監査法人により監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "62"}, {"filed": "2021-04-14", "siblings": 2, "sibling_index": 1, "text": "平成29年５月29日に提出いたしました第85期（自平成28年３月１日至平成29年２月28日）有価証券報告書の\n\n関連当事者情報に記載の誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するもので\n\nあります。\n\n当社大株主の浅山忠彦氏は、主要株主であることから当社の関連当事者であり、当社にてショップを展開する株式\n\n会社エーエフシーの代表取締役会長でもあります。浅山氏個人として当社との取引はなく、また浅山氏が株式会社\n\nエーエフシーの代表取締役として当社と行う間接取引を法人グループの重要性で判定しており、その開示基準に達し\n\nていなかったためこれまで開示対象外としておりました。今般、監査法人より、主要株主が第三者のために会社との\n\n間で行う間接取引については、個人グループの重要性で判断すべきとの指摘があり、今回の訂正となりました。\n\n２", "in_window": true, "ref": "63"}, {"filed": "2023-05-31", "siblings": 2, "sibling_index": 2, "text": "当社は、当社従業員により不適切な取引が行われている疑義がある事案（以下「本件事案」といいます。）が生じた\n\nことを受け、徹底して網羅的な調査を行うため、2022年12月22日に特別調査委員会を設置し、同日より特別調査委員会\n\nによる調査が進められておりました。さらにその後、本件事案とは別事案として、当社取引先において当社を通じた不\n\n適切な取引が行われている疑義が生じたことに端を発し、当社の財務諸表等に影響を与える可能性が生じている事案\n\n（以下「本件追加事案」といいます。）についても、特別調査委員会における調査対象に追加し、併せて調査が進めら\n\nれておりました。\n\n2023年５月８日に特別調査委員会より調査報告書を受領した結果、本件事案については過年度より売上高の水増し計\n\n上及び架空売上の計上、並びに架空もしくは原価性のない外注費の原価計上が行われていたこと等が判明し、また、本\n\n件追加事案についても過年度より実体のない可能性が極めて高い売上高及び売上原価の計上が行われていたことが判明\n\nいたしました。\n\n当社は、これらの売上高及び売上原価を過年度に遡って取り消すことが必要であると判断し、過年度の決算を訂正\n\nし、有価証券報告書及び四半期報告書の訂正報告書を提出することにいたしました。\n\n当該訂正により、当社が2022年３月30日に提出し、2022年８月22日に訂正報告書を提出いたしました第52期（自\n\n2021年１月１日至2021年12月31日）に係る有価証券報告書の記載事項の一部を再訂正する必要が生じましたので、\n\n金融商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、HLBMeisei有限責任監査法人により監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "64"}, {"filed": "2024-04-15", "siblings": 2, "sibling_index": 2, "text": "当社は、当社が関連する太陽光発電（メガソーラー）案件に係る長期未収入金の回収可能性の評価等、また、当社\n\nが元請として受注する別の太陽光発電工事請負案件において、追加工事に係る費用負担に関連して工事原価の増額に\n\n伴う工事原価総額の見積り変更が適切に処理されていなかった可能性が判明した件等に関し、当社とは利害関係を有\n\nしない外部の弁護士及び公認会計士を委員とする外部調査委員会を設置し、事実関係の解明、発生原因及び問題点の\n\n調査分析を行なってまいりました。\n\n当社は、2024年１月15日に受領しました外部調査委員会による中間調査報告書の内容を踏まえ、長期未収入金の回\n\n収可能性の評価に関する会計処理について検討した結果、長期未収入金に対して貸倒引当金を計上することとしまし\n\nた。\n\nまた、同年３月29日に受領しました最終調査報告書の内容を踏まえ、特定の太陽光発電所の建設請負工事案件に係\n\nる工事原価総額及び工事進捗度を合理的に見積もることができないと判断し原価回収基準を適用するとともに、工事\n\n原価発生額の集計を修正しました結果、売上高及び売上原価等を訂正することとしました。\n\nこれらの訂正により、2022年７月29日に提出し、2023年２月10日に訂正報告書を提出いたしました第112期有価証券\n\n報告書（自2021年４月１日至2022年３月31日）の記載事項の一部に訂正すべき事項がありましたので、金融商\n\n品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任あずさ監査法人により監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "65"}, {"filed": "2022-05-16", "siblings": 1, "sibling_index": 1, "text": "当社グループは、2021年12月期の決算業務を進めるなかで、当社のオフィスデザインの役務提供取\n引において、不適切な売上処理が行われていた疑いがあることが判明したため、2022年2月18日から利\n害関係を有しない外部の有識者から構成される特別調査委員会を設置し、調査を開始いたしました。\n\n当社は、2022年4月22日に特別調査委員会から調査報告書を受領し、売上の前倒し計上、仕入計上の\n\n先送り、原価付替え及び架空売上の計上等の不適切な会計処理の修正が必要と判断いたしました。\n\nこれに伴い過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並\n\nびに四半期連結財務諸表等で対象となる部分について訂正することといたしました。\n\nこれらの決算訂正により、当社が2021年３月23日に提出いたしました第31期（自2020年１月１\n日至2020年12月31日）有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融\n商品取引法第24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものでありま\nす。\n\nなお、訂正後の連結財務諸表及び財務諸表については、EY新日本有限責任監査法人の監査を受けて\n\nおり、その監査報告書を添付しております。\n\n２", "in_window": true, "ref": "66"}, {"filed": "2019-06-27", "siblings": 4, "sibling_index": 3, "text": "平成30年８月10日に提出いたしました第32期（自平成28年４月１日至平成29年３月31日）有価証券報告書の\n\n記載事項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものでありま\n\nす。\n\n2/6\n\n\n\fEDINET提出書類\n\n株式会社省電舎ホールディングス(E05452)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "67"}, {"filed": "2018-08-10", "siblings": 4, "sibling_index": 2, "text": "(1)経緯\n\n当社は、外部からの指摘により、当社における不正会計の可能性を認識したことから、平成30年２月28日の取締\n\n役会において、当社の過年度決算における不適切な会計処理等に係る事実認識を目的とした社内調査委員会の設置\n\nを決議して調査を開始し、その後平成30年５月11日から調査主体を独立委員会に移行して調査を行ってまいりまし\n\nた。\n\n平成30年７月11日に独立委員会による調査報告書の指摘を受け、過去に提出いたしました有価証券報告書等に記\n\n載されている連結財務諸表及び財務諸表並びに四半期連結財務諸表に含まれる不適切な会計処理を訂正するために\n\n有価証券報告書の訂正報告書を提出するものであります。\n\n(2)会計処理\n\n連結財務諸表及び財務諸表並びに四半期連結財務諸表において、不適切な会計処理により過大に計上されていた\n\n「売上高」の金額を修正するとともに、関連する「売掛金」「未成工事支出金」「関係会社株式」等の残高を修正\n\nし、その他必要と認められる修正を行いました。\n\nこれらの修正により、当社が平成29年６月30日に提出いたしました第32期（自平成28年４月１日至平成29\n\n年３月31日）有価証券報告書の訂正報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第\n\n24条の２第１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\n訂正後の連結財務諸表及び財務諸表については、松澤公認会計士事務所及び向山公認会計士事務所により監査を\n\n受けており、その監査報告書を添付しております。\n\nなお、連結財務諸表及び財務諸表の記載内容に係る訂正箇所についてはXBRLの修正も行いましたので、併せて修\n\n正後のXBRLデータ一式（表示情報ファイルを含む）を提出いたします。\n\n2/93\n\n\n\n\fEDINET提出書類\n\n株式会社省電舎ホールディングス(E05452)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "68"}, {"filed": "2020-04-22", "siblings": 1, "sibling_index": 1, "text": "平成30年６月27日に提出いたしました第26期（自平成29年４月１日至平成30年３月31日）有価証券報告書の記\n\n載事項の一部に訂正すべき事項がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出するもの\n\nEDINET提出書類\n\nグローム・ホールディングス株式会社(E04034)\n\n訂正有価証券報告書\n\nであります。\n\n２", "in_window": true, "ref": "69"}, {"filed": "2022-07-29", "siblings": 2, "sibling_index": 1, "text": "2022年５月31日に提出いたしました第27期（自2021年３月１日至2022年２月28日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社アクアライン(E31694)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "70"}, {"filed": "2023-02-14", "siblings": 1, "sibling_index": 1, "text": "当社は、2023年１月20日付けの「過年度決算の訂正に関するお知らせ」で公表しました通り、人材データベース運営\n\n会社への手数料の支払について、支払漏れが生じているのではないかとの指摘を一部の運営会社より受け、運営会社と\n\nの協議及び社内調査を実施いたしました。調査の結果、手数料の支払漏れが判明し、それに伴う売上原価、販売費及び\n\n一般管理費に関する会計処理の訂正が必要となることが判明いたしました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表、四半期連\n\n結財務諸表並びに四半期財務諸表で対象となる部分について訂正することにいたしました。\n\nなお、訂正に際しては、過年度において重要性の観点から訂正を行っていなかった他の未修正事項の訂正も併せて\n\n行っております。\n\nこれらの決算訂正により、当社が2022年６月17日に提出いたしました第６期（自2021年４月１日至2022年３月\n\n31日）有価証券報告書の記載事項の一部に訂正する必要性が生じましたので、これを訂正するため、有価証券報告書の\n\n訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、三優監査法人の監査を受けており、その監査報告書を添付し\n\nております。\n\n２", "in_window": true, "ref": "71"}, {"filed": "2022-01-28", "siblings": 1, "sibling_index": 1, "text": "2021年５月31日に提出いたしました第110期（自2020年３月１日至2021年２月28日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\nタキヒヨー株式会社(E02776)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "72"}, {"filed": "2024-08-14", "siblings": 2, "sibling_index": 1, "text": "2022年３月28日に提出いたしました第18期(自2021年１月１日至2021年12月31日)有価証券報告書の記載事項\n\nの一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\n当社は、2023年12月期決算につきまして、有限責任監査法人トーマツによる財務諸表監査及び内部統制監査により\n\n適正意見を得て、2024年３月28日に有価証券報告書及び内部統制報告書を提出いたしました。また当社は、2024年12\n\n月期より新たにEY新日本有限責任監査法人による財務諸表監査及び内部統制監査を受けておりますが、2024年12月期\n\n第１四半期の四半期レビューの過程において、EY新日本有限責任監査法人より、当社連結子会社の株式会社kubellス\n\nトレージ（旧Chatworkストレージテクノロジーズ株式会社）の株式取得時に識別した顧客関連資産について、2023年\n\n12月期決算において減損損失を計上すべきであったのではないかとの指摘を受けました。その後、有限責任監査法人\n\nトーマツとの確認を進める中で、訂正前の連結財務諸表等においては、顧客関連資産を同社の資産のグルーピングに\n\n含めずに減損損失の認識の判定を行っておりましたが、同社の固定資産の減損に係る会計基準の適用について改めて\n\n見直した結果、顧客関連資産を同社の資産のグルーピングに含めることが適切であり、且つ、同資産グループの主要\n\nな資産は、同社のビジネスの特性に鑑みてソフトウェアとすることが適切であると判断しました。その結果、減損損\n\n失の認識が識別され、減損損失の測定を行ったところ、顧客関連資産について全額減損処理する必要が生じたため、\n\n2024年５月15日に2023年12月期の有価証券報告書及び内部統制報告書について訂正報告書を提出いたしました。\n\nその後、2024年12月期第２四半期の決算作業の過程（自主点検）において、新たに当社連結子会社の株式会社\n\nkubellストレージ（旧Chatworkストレージテクノロジーズ株式会社）の株式取得時に識別した顧客関連資産の計上額\n\nに誤りがあった可能性を認識し、当時の会計処理の精査、当時の会計監査人であった有限責任監査法人トーマツとの\n\n確認を進める中で、株式取得時の取得原価の配分手続の過程において、顧客関連資産を過少に計上していたことを確\n\n認いたしました。また、これに関連して、同社の固定資産の減損に係る会計基準の適用について改めて見直した結\n\n果、2021年12月期決算において、減損損失の認識が識別され、減損損失の測定を行ったところ、同社のソフトウェア\n\n及び顧客関連資産に減損処理が必要であったことを確認したため、対象となる2021年12月期から2023年12月期までの\n\n有価証券報告書、及び2022年12月期第１四半期から2024年12月期第１四半期までの四半期報告書に遡り訂正報告書を\n\n提出することとしたものであります。\n\n２", "in_window": true, "ref": "73"}, {"filed": "2022-07-28", "siblings": 1, "sibling_index": 1, "text": "当社は、2021年11月９日付けの「特別調査委員会の設置及び2022年３月期第２四半期決算発表の延期に関するお知ら\n\nせ」で公表しました通り、外部からの指摘を受け、事実経緯の確認のために社内調査、検討を進めた結果、一部の取引\n\nについて会計処理の適切性に疑念があることを認識しました。かかる事態を受け、当社は2021年11月９日に外部の専門\n\n家を委員長とする特別調査委員会を設置し、調査を進めて参りました。\n\n当社は2022年１月27日に特別調査委員会から調査報告書を受領し、売上の前倒し計上、架空売上の計上及び架空原価\n\nの計上等の不適切な会計処理の修正が必要との判断をいたしました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表等及び財務諸表等、四半\n\n期財務諸表並びに四半期連結財務諸表で対象となる部分について訂正することにいたしました。\n\nこれらの決算訂正により、当社が2021年６月30日に提出いたしました第21期（自2020年４月１日至2021年３月\n\n31日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の2第1項の規\n\n定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表等及び財務諸表等については、南青山監査法人の監査を受けており、その監査報告書を\n\n添付しております。\n\n２", "in_window": true, "ref": "74"}, {"filed": "2020-11-13", "siblings": 1, "sibling_index": 1, "text": "監査法人による2021年２月期第２四半期レビュー手続きの中で、当社の連結子会社である株式会社あしたのチームに\n\nおける特定の取引に関わる売上について期間帰属の適正性に疑義が識別され、過年度の類似事象の存否を含めた事実関\n\n係についての精査が必要となることが判明したことから、当社は、2020年10月９日付で社外有識者を主要メンバーとす\n\nる社内調査委員会の設置を決定しました。\n\n社内調査委員会による調査の結果として、2020年５月28日に提出いたしました第28期（自2019年３月１日至\n\n2020年２月29日）有価証券報告書の記載事項の一部に訂正すべき事項がありましたので、これを訂正するため有価証券\n\n報告書の訂正報告書を提出するものであります。\n\n訂正後の連結財務諸表及び財務諸表については、東陽監査法人により監査を受けており、その監査報告書を添付して\n\nおります。\n\n２", "in_window": true, "ref": "75"}, {"filed": "2020-04-13", "siblings": 1, "sibling_index": 1, "text": "当社は2019年11月26日に、不正行為を理由に当社が解雇し刑事告訴した当社管理部門の上位職にあった元従業員\n\n（以下「元従業員」といいます。）から、在籍時に経営陣より指示を受け不適切な会計処理を行っていた旨の通知を\n\n受領いたしました。2019年12月12日付で外部の専門家を含む特別調査委員会を設置し、同委員会が元従業員の主張す\n\nる過年度決算における不適切な会計処理の疑義に係る事実関係の有無等について調査を開始いたしました。\n\nその後、特別調査委員会から本件について具体的な疑義が存在することが判明した旨の指摘を受けたため、当社は\n\nより透明性の高い枠組みでの調査を行うことが調査に対するステークホルダーの皆様からの信頼性を高め、ひいては\n\n当社の重要課題であるより迅速な資金調達にも資すると判断し、2019年12月26日付で当社から独立した中立・公正な\n\n社外委員のみで構成される第三者委員会による調査の枠組みへ移行し、同委員会が調査を引継いで行いました。\n\n本日付「第三者委員会の調査報告書の受領に関するお知らせ」にてお知らせしましたとおり、第三者委員会による\n\n調査の結果、過去において100億円規模の架空在庫計上や費用や損失の先送り等を含む11項目の不適切会計処理が判明\n\nいたしました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四\n\n半期連結財務諸表等で対象となる部分について訂正することといたしました。\n\nこれらの決算訂正により、当社が平成30年６月19日に提出いたしました第16期（自平成29年４月１日至平成\n\n30年３月31日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の\n\n規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任あずさ監査法人により監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "76"}, {"filed": "2020-03-13", "siblings": 3, "sibling_index": 2, "text": "当社は、東京国税局による税務調査の過程で、当社の一部取引について納品の事実が確認できない疑義があるとの指\n\n摘を受けたため、2019年12月13日、当該指摘に係る事実関係の解明、並びに事実と認められた場合の原因の究明、類似\n\n事象の有無の確認、連結財務諸表等への影響額の算定、及び再発防止策の提言を目的として、当社とは利害関係を有し\n\nない外部の弁護士及び公認会計士で構成される特別調査委員会を設置いたしました。\n\n当社は、特別調査委員会の2020年３月12日付け最終調査報告書を受領し、同報告書に記載された調査結果から、2014\n\n年12月以降、納品実体のない取引が繰り返し行われていたことを認識するに至りました。この結果、第32期（自2018\n\n年４月１日至2019年３月31日）においては、売上高6,530百万円、売上原価5,670百万円をそれぞれ取消処理し、不\n\n正行為に関連した取引を取消処理したことで生じた差額1,389百万円は「流動資産のその他」に含めて表示し、債権に\n\nついては特別損失3,875百万円を計上しております。\n\nこれらの決算訂正により、当社が2019年６月14日に提出しました第32期（自2018年４月１日至2019年３月31\n\n日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の規定に基づ\n\nき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、有限責任監査法人トーマツにより監査を受けており、その監\n\n査報告書を添付しております。\n\n２", "in_window": true, "ref": "77"}, {"filed": "2025-01-16", "siblings": 2, "sibling_index": 2, "text": "2024年11月５日に提出いたしました第34期（自2022年６月１日至2023年５月31日）有価証券報告書の訂正報告\n\n書の記載事項の一部に訂正すべき事項がありましたので、これを訂正するため、有価証券報告書の訂正報告書を提出す\n\nるものであります。\n\nなお、訂正理由は、次のとおりです。\n\n１．当初の訂正理由として、不適切な会計処理に関し第三者委員会の調査を経て自主調査の結果、売買取引と金融取\n\n引の分類（実質的には金融取引として強く疑われるものを含む）、売上計上時期の認識時点（売買契約締結時に売\n\n上計上されていたが引渡時に売上計上されるべきであったもの）に関し不適切な会計処理が行われていたこと及び\n\n繰延税金資産の取り崩し処理の必要性が認められ、訂正報告書を提出しました。\n\n２．再訂正の理由として、当初の訂正の際に他の多くの報告書（2019年５月期から2023年５月期の各有価証券報告書\n\n等の訂正報告書）も同時併行で短期間に作成していたことから、確認不足に起因する記載漏れなどのミスが追加的\n\nに判明し、今回の訂正報告書の再訂正が発生しました。\n\n２", "in_window": true, "ref": "78"}, {"filed": "2019-04-10", "siblings": 2, "sibling_index": 1, "text": "平成31年３月29日に提出いたしました第43期（自平成30年１月１日至平成30年12月31日）有価証券報告書の\n\n記載事項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものでありま\n\nEDINET提出書類\n\nラオックス株式会社(E03101)\n\n訂正有価証券報告書\n\nす。\n\n２", "in_window": true, "ref": "79"}, {"filed": "2020-01-10", "siblings": 1, "sibling_index": 1, "text": "2019年12月18日に提出いたしました第29期（自2018年10月１日至2019年９月30日）に係る有価証券報告書に添\n\n付しております独立監査人の監査報告書及び内部統制監査報告書の記載事項の一部に誤りがありましたので、これを訂\n\n正するために有価証券報告書の訂正報告書を提出するものであります。\n\n株式会社セプテーニ・ホールディングス(E05206)\n\n訂正有価証券報告書\n\nEDINET提出書類\n\n２", "in_window": true, "ref": "80"}, {"filed": "2024-05-13", "siblings": 1, "sibling_index": 1, "text": "2024年３月27日に提出いたしました第48期（自2023年１月１日至2023年12月31日）有価証券報告書の記載事\n\n項の一部に誤りがありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社サンセイランディック(E26086)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "81"}, {"filed": "2022-09-13", "siblings": 1, "sibling_index": 1, "text": "当社は、2022年７月22日付けの「特別調査委員会設置及び2023年３月期第１四半期決算発表の延期に関するお知ら\n\nせ」で公表しました通り、2023年３月期第１四半期の決算作業の過程で、当社の連結子会社であるタチバナ精機株式\n\n会社において、棚卸資産に関する不適切な会計処理の疑義があることを認識しました。かかる事態を受け、当社は\n\n2022年７月22日に外部の有識者のみで構成する特別調査委員会を設置し、調査を進めて参りました。\n\n当社は2022年９月13日に特別調査委員会から調査報告書を受領し、棚卸資産の架空計上及び滞留在庫の過大評価等\n\nの不適切な会計処理の修正が必要と判断をいたしました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び四半期連結財務諸\n\n表で対象となる部分について訂正することにいたしました。\n\nなお、訂正に際しては、過年度において重要性の観点から訂正を行っていなかった事項の訂正も併せて行っており\n\nます。\n\nこれらの決算訂正により、当社が2021年６月24日に提出いたしました第61期（自2020年４月１日至2021年３月31\n\n日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の\n\n規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表については、有限責任あずさ監査法人の監査を受けており、その監査報告書を添付し\n\nております。\n\n２", "in_window": true, "ref": "82"}, {"filed": "2021-07-15", "siblings": 2, "sibling_index": 2, "text": "繰延税金負債については、繰延税金資産の回収可能性の判断に関する手順において、将来減算一時差異の解消見込\n\n額と将来加算一時差異の解消見込額とを解消見込年度ごとに相殺することとされています。しかしながら、過年度に\n\nおいてこの相殺を行うことなく将来加算一時差異の全額に対して繰延税金負債が計上され過大計上されていたことが\n\n判明したため、監査法人と協議のうえ、本件について過年度の決算を訂正することといたしました。なお、本訂正に\n\n合わせて、その他の重要性の乏しい過年度の未修正の誤謬につきましても訂正しております。\n\nこれらの決算訂正により、当社が平成29年５月29日に提出いたしました第85期（自平成28年３月１日至平成\n\n29年２月28日）に係る有価証券報告書の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の\n\n規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、EY新日本有限責任監査法人により監査を受けており、その\n\n監査報告書を添付しております。\n\n２", "in_window": true, "ref": "83"}, {"filed": "2024-06-28", "siblings": 1, "sibling_index": 1, "text": "2024年６月24日に提出いたしました第46期（自2023年４月１日至2024年３月31日）有価証券報告書について、\n\n金融商品取引法第24条第６項及び企業内容等の開示に関する内閣府令第17条第１項により添付することとされている書\n\n類の添付漏れがありましたので、これを添付するため有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\nアリアケジャパン株式会社(E00486)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "84"}, {"filed": "2023-04-06", "siblings": 1, "sibling_index": 1, "text": "2023年２月24日に提出した第110期（自2021年12月１日至2022年11月30日）有価証券報告書の記載事項の一部\n\nに訂正すべき事項がありましたので、これを訂正するため有価証券報告書の訂正報告書を提出するものです。\n\nEDINET提出書類\n\nキユーピー株式会社(E00464)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "85"}, {"filed": "2018-08-15", "siblings": 1, "sibling_index": 1, "text": "当社における不動産事業等及び当社連結子会社である株式会社kiddingにおける不動産フランチャイズ権利販売にお\n\nいて、会計上疑義のある取引が存在することが判明いたしました。当社といたしましては、本件に関し、専門的かつ客\n\n観的な見地からの調査が必要と判断し、平成30年７月10日に取締役会を開催し、当社と利害関係を有しない外部の専門\n\n家から構成される第三者委員会を設置し、当該取引の事実関係の調査等を行いました。\n\n平成30年８月10日付で同委員会による調査報告書を受領いたしました。その結果、当社及び連結子会社である株式会\n\n社kiddingの取引において、従来、事業取引として計上していた取引の一部に弊社取締役の私財を投じた取引が確認さ\n\nれ、当該取引は実在するものの、計上は資金取引等として取り扱うべきである旨、指摘されました。\n\n当社は、過去に提出した有価証券報告書に記載されている連結財務諸表に含まれる当該取引に係る会計処理を訂正す\n\nることを平成30年８月15日開催の取締役会の承認を経て決定し、当該有価証券報告書について訂正を行うことといたし\n\nました。\n\nこれらの決算訂正により、当社が平成29年２月24日に提出いたしました第13期（自平成27年12月１日至平成28\n\n年11月30日）に係る有価証券報告書の一部を訂正する必要が生じましたので、有価証券報告書の訂正報告書を提出する\n\nものであります。\n\nなお、訂正後の連結財務諸表については、ひので監査法人により監査を受けており、その監査報告書を添付しており\n\nます。\n\n２", "in_window": true, "ref": "86"}, {"filed": "2023-03-24", "siblings": 3, "sibling_index": 2, "text": "2023年３月８日に提出いたしました第113期（自2018年３月１日至2019年２月28日）有価証券報告書の訂正報\n\n告書に添付しております「独立監査人の監査報告書」の記載事項の一部に誤りがありましたので、これを訂正するた\n\nめ有価証券報告書の訂正報告書を提出するものであります。\n\nEDINET提出書類\n\n株式会社東京衡機(E01587)\n\n訂正有価証券報告書\n\n２", "in_window": true, "ref": "87"}, {"filed": "2022-03-31", "siblings": 2, "sibling_index": 1, "text": "当社は、2022年９月期第１四半期報告書に係る四半期レビュー手続の過程で会計監査人からの指摘を受け、連結子会\n\n社である株式会社セントラルパートナーズにおいて、売掛金の過大計上の疑いがあることが判明しました。そのため当\n\n社は、2022年２月９日、外部の弁護士及び公認会計士を含む独立調査委員会を設置し、調査を進めてまいりました。\n\nその結果、2022年３月25日に独立調査委員会から調査報告書を受領し、2016年９月期第２四半期以降、売掛金が過大\n\nに計上されていたこと等についての報告を受けました。\n\nこれに伴い当社は、過去に提出済みの有価証券報告書等に記載されております連結財務諸表及び財務諸表並びに四半\n\n期連結財務諸表等で対象となる部分について、訂正することといたしました。\n\nなお、訂正に際しては、過年度において重要性の観点から訂正を行っていなかった事項の訂正も併せて行っておりま\n\nす。\n\nこれらの決算訂正により、当社が2020年12月28日に提出いたしました第30期（自2019年10月１日至2020年９月\n\n30日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第１項の\n\n規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、栄監査法人により監査を受けており、その監査報告書を添付\n\nしております。\n\n２", "in_window": true, "ref": "88"}, {"filed": "2021-09-14", "siblings": 1, "sibling_index": 1, "text": "当社は、当社の取引先における法人税法違反の捜査の過程で、当社において不適切な会計処理が行われていた可能性\n\nがあることが判明し、当社では社内調査を行うとともに、令和３年７月26日に第三者調査委員会を設置して調査を開始\n\nし、令和３年９月７日に同委員会の中間調査報告書を受領しました。\n\nその結果、平成26年から当社の役員及び東京支社に所属する従業員が、外注先の工事業者に指示して過剰な外注費を\n\n当社に対して請求させ、それを原資にキックバックを受領しており、当該不正により、過年度から上記の過剰な外注費\n\nが売上原価に計上されていたことが認められました。\n\n当社は、第三者調査委員会の中間調査結果報告書の内容及び社内調査の結果から、上記事実のほか、不正が行われた\n\n経緯、不正の関与者及び各連結会計年度における影響額を特定いたしました。これによる過年度からの累積的影響額に\n\n重要性があるものと判断し、平成29年３月期以降の有価証券報告書等における不適切な会計処理の訂正を行うこととい\n\nたしました。\n\n売上原価に計上されていた外注費の過剰支払額については、投資その他の資産に振り替え、回収可能性が乏しいと判\n\n断した金額については、貸倒引当金を計上しております。これに係る貸倒引当金繰入額は、特別損失として計上してお\n\nります。また、当該修正に伴う、法人税、住民税及び事業税への影響額も修正いたしております。\n\nさらに、過年度の連結決算において、重要性がないため訂正を行っていなかった他の未修正事項の訂正も併せて行っ\n\nております。\n\nこれらの決算訂正により、当社が平成30年６月28日に提出いたしました第59期（自平成29年４月１日至平成30\n\n年３月31日）に係る有価証券報告書の記載事項の一部を訂正する必要が生じましたので、金融商品取引法第24条の２第\n\n１項の規定に基づき、有価証券報告書の訂正報告書を提出するものであります。\n\nなお、訂正後の連結財務諸表及び財務諸表については、太陽有限責任監査法人による監査を受けており、その監査報\n\n告書を添付しております。\n\n２", "in_window": true, "ref": "89"}]}</script>
<script>
const ITEMS = JSON.parse(document.getElementById("payload").textContent);
const BUCKETS = [["A", "financial-statement correction"], ["B", "non-financial correction"], ["C", "mixed"], ["D", "cannot determine"]];
const MARKERS = [["kaikei", "不適切な会計処理 / 粉飾 / 不正"], ["iinkai", "第三者委員会 / 特別調査委員会"], ["sokyu", "過年度遡及修正"], ["goki", "誤り / 誤記 / 誤植 — clerical wording"], ["kisei", "規制当局 (証券取引等監視委員会 / 課徴金)"]];
const GLOSSARY = [["不適切な会計処理", "ふてきせつなかいけいしょり", "improper accounting treatment", "25%"], ["財務諸表 / 連結財務諸表", "ざいむしょひょう", "financial statements / consolidated", "71%"], ["計上", "けいじょう", "recognition, booking of an amount", "51%"], ["過年度", "かねんど", "prior fiscal years", "47%"], ["監査報告書 / 監査法人", "かんさほうこくしょ / かんさほうじん", "audit report / audit firm", "44%"], ["調査委員会", "ちょうさいいんかい", "investigation committee", "41%"], ["特別調査委員会", "とくべつちょうさいいんかい", "special investigation committee", "23%"], ["第三者委員会", "だいさんしゃいいんかい", "third-party committee (external)", "14%"], ["社内調査", "しゃないちょうさ", "internal investigation", "15%"], ["売上 / 売上高", "うりあげ / うりあげだか", "revenue", "31%"], ["誤り", "あやまり", "error, mistake", "24%"], ["不正", "ふせい", "misconduct, impropriety", "15%"], ["架空", "かくう", "fictitious, fabricated", "11%"], ["引当金", "ひきあてきん", "provision, allowance", "10%"], ["減損", "げんそん", "impairment", "10%"], ["過大計上 / 過少計上", "かだい / かしょうけいじょう", "overstatement / understatement", "8%"], ["内部統制", "ないぶとうせい", "internal control", "7%"], ["開示すべき重要な不備", "かいじすべきじゅうようなふび", "material weakness requiring disclosure", "—"], ["役員 / 異動", "やくいん / いどう", "officers, directors / change of personnel", "5%"], ["在庫 / 棚卸資産", "ざいこ / たなおろししさん", "inventory", "4%"], ["遡及", "そきゅう", "retrospective (restatement)", "3%"], ["添付漏れ / 記載漏れ", "てんぷもれ / きさいもれ", "missing attachment / omitted disclosure", "4%"], ["証券取引等監視委員会", "しょうけんとりひきとうかんしいいんかい", "Securities and Exchange Surveillance Commission", "2%"], ["循環取引", "じゅんかんとりひき", "circular trading", "1%"], ["課徴金", "かちょうきん", "administrative fine", "0.3%"], ["粉飾", "ふんしょく", "window-dressing, falsified accounts", "<1%"]];
const KEY = "ometsuke-audit-" + ITEMS.seed;
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { answers = {}; }
let i = 0;

const el = (id) => document.getElementById(id);
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(answers)); el("saved").textContent = "saved"; }
  catch (e) { el("saved").textContent = "not saved — export before closing"; }
}
function current() { return ITEMS.items[i]; }
function answer() {
  const id = current().ref;
  if (!answers[id]) answers[id] = { bucket: null, markers: [], note: "", unsure: false };
  return answers[id];
}
function render() {
  const item = current(), a = answer();
  el("counter").textContent = (i + 1) + " / " + ITEMS.items.length;
  el("bar").style.width = ((i + 1) / ITEMS.items.length * 100) + "%";
  el("ident").textContent = "item " + item.ref + " · filed " + item.filed;
  el("sibling").textContent = item.siblings > 1
    ? "amendment " + item.sibling_index + " of " + item.siblings + " for the same filing" : "";
  el("text").textContent = item.text;
  el("buckets").innerHTML = "";
  BUCKETS.forEach(([code, label]) => {
    const b = document.createElement("button");
    b.innerHTML = "<kbd>" + code.toLowerCase() + "</kbd>" + code + " — " + label;
    if (a.bucket === code) b.className = "on";
    b.onclick = () => { a.bucket = code; save(); render(); };
    el("buckets").appendChild(b);
  });
  el("markers").innerHTML = "";
  MARKERS.forEach(([key, label], n) => {
    const wrap = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox"; box.checked = a.markers.includes(key);
    box.onchange = () => {
      a.markers = box.checked ? a.markers.concat([key]) : a.markers.filter((m) => m !== key);
      save();
    };
    wrap.appendChild(box);
    wrap.appendChild(document.createTextNode((n + 1) + ". " + label));
    el("markers").appendChild(wrap);
  });
  el("note").value = a.note || "";
  el("unsure").checked = !!a.unsure;
  el("unsurebox").className = a.unsure ? "unsure on" : "unsure";
  window.scrollTo(0, 0);
}
el("note").oninput = () => { answer().note = el("note").value; save(); };
el("unsure").onchange = () => { answer().unsure = el("unsure").checked; save(); render(); };
el("glosstable").innerHTML = GLOSSARY.map(
  (g) => "<tr><td>" + g[0] + "</td><td>" + g[1] + "</td><td>" + g[2] + "</td><td>" + g[3] + "</td></tr>"
).join("");
el("prev").onclick = () => { if (i > 0) { i--; render(); } };
el("next").onclick = () => { if (i < ITEMS.items.length - 1) { i++; render(); } };
el("export").onclick = () => {
  const out = JSON.stringify({ seed: ITEMS.seed, built: ITEMS.built, answers }, null, 2);
  const blob = new Blob([out], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "audit-results.json"; a.click();
  navigator.clipboard && navigator.clipboard.writeText(out);
};
el("importbtn").onclick = () => el("importfile").click();
el("importfile").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let incoming;
    try { incoming = JSON.parse(reader.result); }
    catch (err) { alert("Not valid JSON."); return; }
    if (String(incoming.seed) !== String(ITEMS.seed)) {
      alert("Refusing to import: that file was exported from seed " + incoming.seed +
            ", this worksheet is seed " + ITEMS.seed + ". The refs would not line up.");
      return;
    }
    const known = new Set(ITEMS.items.map((it) => it.ref));
    const unknown = Object.keys(incoming.answers || {}).filter((r) => !known.has(r));
    if (unknown.length) {
      alert("Refusing to import: " + unknown.length + " refs in that file are not in this worksheet.");
      return;
    }
    answers = Object.assign({}, answers, incoming.answers);
    save();
    i = 0;
    const done = Object.values(answers).filter((a) => a && a.bucket).length;
    while (i < ITEMS.items.length - 1 && answers[ITEMS.items[i].ref] &&
           answers[ITEMS.items[i].ref].bucket) { i++; }
    render();
    alert("Imported " + done + " classified items. Resuming at item " + ITEMS.items[i].ref + ".");
  };
  reader.readAsText(file);
};
document.onkeydown = (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = e.key.toLowerCase();
  const bucket = BUCKETS.find(([code]) => code.toLowerCase() === k);
  if (bucket) {
    answer().bucket = bucket[0]; save();
    if (i < ITEMS.items.length - 1) { i++; }
    render(); return;
  }
  if (k >= "1" && k <= String(MARKERS.length)) {
    const key = MARKERS[Number(k) - 1][0], a = answer();
    a.markers = a.markers.includes(key) ? a.markers.filter((m) => m !== key) : a.markers.concat([key]);
    save(); render(); return;
  }
  if (k === "g") { el("gloss").open = !el("gloss").open; return; }
  if (k === "u") { el("unsure").checked = !el("unsure").checked; el("unsure").onchange(); return; }
  if (e.key === "ArrowRight") el("next").click();
  if (e.key === "ArrowLeft") el("prev").click();
};
render();
</script>
